# BULC MCP — machine-readable modelling rules for LLM agents
#
# 각 규칙은 "이런 상태면 틀렸다(condition) → 이 도구로 확인한다(check) → 이렇게 고친다(fix)" 형식입니다.
# 도구 이름은 BULC MCP 서버 기준이며, 최종 기준은 서버의 tools/list 입니다.
#
# severity
#   error   : 덱이 만들어지지 않거나 FDS/엔진이 시작하지 못하거나, 결과가 명백히 틀립니다.
#   warning : 실행은 되지만 결과가 의도와 다를 가능성이 큽니다.
#   info    : 알아 두면 오류를 줄이는 규약·제약입니다.
# confidence
#   verified          : BULC 도구·점검 로직 또는 FDS 6.10.1 실행으로 확인한 사실
#   convention        : BULC 의 작업 규약
#   guidance          : 일반 공학 지침(FDS 사용자 안내서 등) — 사례에 맞게 판단
#   regulatory_verify : 법규·기준 힌트 — 적용 시점의 원문과 발주처 요구로 반드시 확인
#   engine_snapshot   : 엔진 지원 범위(2026-10 기준). 엔진 업데이트로 바뀔 수 있으므로 실행 로그 경고를 함께 확인

schema_version: 1
updated: "2026-10-02"
fds_version: "6.10.1"

rules:

  # ═════════════════════════ GENERAL ═════════════════════════
  - id: GEN-001
    domain: general
    severity: error
    confidence: verified
    applies_to: [all]
    title: "모든 값은 도구 스키마에 적힌 단위로 넣습니다"
    title_en: "Use the unit stated in each tool schema"
    condition: "도면 단위(mm)나 미국 단위(ft, gpm, psi)를 변환하지 않고 넣었습니다. 도구마다 단위가 다릅니다: 길이 m, 덕트·배관 지름 mm, HVAC 풍량 CFM, 배관망 압력 MPa, FDS 스프링클러 압력 bar, 온도 °C, HRRPUA kW/m²."
    check: {tools: [get_object_properties, preview_fds], how: "덱에서 XB 가 수천 단위면 mm 를 그대로 넣은 것입니다. 1층 높이가 3000 이면 오류입니다."}
    fix: {how: "ontology.yaml conventions.units 표대로 변환한 뒤 다시 입력합니다. 1 ft = 0.3048 m, 1 gpm = 3.785 L/min, 1 psi = 0.06895 bar, US K × 14.41 = 미터 K."}

  - id: GEN-002
    domain: general
    severity: error
    confidence: verified
    applies_to: [Obstacle, Vent, Device, Fire]
    title: "z 가 연직축입니다"
    title_en: "z is vertical"
    condition: "도면의 세로 방향(y)을 높이(z)로 넣었거나, 높이를 y 에 넣었습니다."
    check: {tools: [list_obstacles, preview_fds], how: "벽 XB 의 z 범위가 층고(약 3 m)와 맞는지, y 범위가 평면 치수와 맞는지 봅니다."}
    fix: {how: "평면 좌표 → (x, y), 높이 → z. 이미지 픽셀 y 는 아래로 증가하므로 뒤집습니다(ontology conventions.coordinates.image_y_flip)."}

  - id: GEN-003
    domain: general
    severity: error
    confidence: verified
    applies_to: [Obstacle, Vent, Hole, Fire, Mesh, Device]
    title: "XB 는 [x1, x2, y1, y2, z1, z2] 순서이고 각 쌍은 작은 값이 먼저입니다"
    title_en: "XB is [x1,x2,y1,y2,z1,z2] with min before max"
    condition: "XB 를 [x1, y1, z1, x2, y2, z2] 순서로 넣었거나 min > max 입니다."
    check: {tools: [validate_project, preview_fds], how: "메시는 min ≥ max 이면 오류로 잡힙니다. 장애물은 엉뚱한 자리에 생기므로 preview_fds 로 확인합니다."}
    fix: {tools: [update_obstacle, update_vent, update_hole], how: "축별 (min, max) 쌍으로 다시 씁니다."}

  - id: GEN-004
    domain: general
    severity: error
    confidence: verified
    applies_to: [all]
    title: "ID 는 그룹 안에서 유일해야 합니다"
    title_en: "IDs must be unique within a namelist group"
    condition: "같은 ID 로 두 번 만들었습니다. 도구는 'already exists' 로 거절하거나, 가져온 덱이면 validate_project 가 'ID 중복' 오류를 냅니다."
    check: {tools: [validate_project, list_obstacles, list_vents, list_devices]}
    fix: {how: "규칙적인 접두어로 ID 를 만듭니다(예: W_1F_01, Door_E1, SD_2F_03)."}

  - id: GEN-005
    domain: general
    severity: error
    confidence: verified
    applies_to: [all]
    title: "목록에 없는 도구나 인자를 가정하지 않습니다"
    title_en: "Never assume a tool or argument exists"
    condition: "tools/list 에 없는 도구(예: evac_add_exit, aset_report, import_architecture_drawing, start_simulation)를 부르거나 스키마에 없는 인자를 넣었습니다. 인자 검증기가 필수 누락·형식 오류·오타 키를 거절합니다. 앱 버전마다 도구가 다릅니다 — BULC 0.89 부터 project_*, sim_*, evac_run, fire_*, arch_*, capture_view 가 있고 그 이전 앱에는 없습니다."
    check: {tools: [bulc_find_tools, bulc_connection_status], how: "작업 시작 시 tools/list(또는 bulc_find_tools)로 실제 도구를 확인하고, 거절 메시지가 제안하는 인자 이름을 따릅니다. bulc_plan_check 가 없는 도구를 실제 도구로 안내합니다."}
    fix: {how: "있는 도구로 바꿉니다(출구 → add_door id='Door_…', ASET → fire_compute_aset, 건축 도면 → arch_analyze_drawing). 그 앱 버전에 도구가 없으면 사용자에게 앱 화면에서 할 일을 안내하고, 도구로 했다고 말하지 않습니다."}

  - id: GEN-006
    domain: general
    severity: error
    confidence: verified
    applies_to: [Project]
    title: "편집을 마칠 때마다, 그리고 저장·실행 전에는 반드시 validate_project 를 돌립니다"
    title_en: "Run validate_project after each batch of edits and before export/run"
    condition: "도구가 '성공'이라고 답해도 덱 생성이 깨져 있거나(예: CTRL 의 INPUT_ID 누락), FDS 가 입력 단계에서 멈추는 조합(ERROR 314, 1020, 1021, 938)이 남아 있을 수 있습니다."
    check: {tools: [validate_project], how: "[오류] 가 0 건이어야 하고, [경고] 는 하나씩 의도한 것인지 판단합니다."}
    fix: {how: "오류 문구가 가리키는 도구로 고친 뒤 다시 validate_project 를 돌립니다."}

  - id: GEN-007
    domain: general
    severity: info
    confidence: verified
    applies_to: [Project]
    title: "덱 텍스트로 결과를 확인합니다"
    title_en: "Confirm changes in the deck text"
    condition: "변경이 덱에 어떻게 들어갔는지 확인하지 않고 다음 단계로 넘어갔습니다."
    check: {tools: [preview_fds], how: "namelist 인자로 한 그룹만 봅니다(예: MESH, OBST, VENT, SURF, DEVC, DUMP)."}

  - id: GEN-008
    domain: general
    severity: warning
    confidence: verified
    applies_to: [PipeNode, HvacNode, Agent, Stair, Waypoint, Journey]
    title: "스토어가 만드는 id 는 만든 뒤 목록 도구로 읽습니다"
    title_en: "Read generated ids back with the summary tools"
    condition: "배관 노드·HVAC 노드·피난 객체의 id 를 짐작해서 다음 호출(spr_add_pipe, hvac_add_duct 등)에 넣었습니다."
    check: {tools: [spr_list_summary, hvac_list_summary, evac_list_summary]}
    fix: {how: "노드를 몇 개 만든 뒤 요약 도구로 id 를 읽고 연결합니다. 대량이면 spr_import_network(손으로 쓴 network 페이로드의 ref)를 씁니다."}

  - id: GEN-009
    domain: general
    severity: warning
    confidence: verified
    applies_to: [Project]
    title: "CHID 는 저장 파일 이름으로 정해집니다"
    title_en: "CHID follows the saved file name"
    condition: "set_chid 로 정한 CHID 가 결과 파일 이름이 될 것이라고 가정했습니다. 앱이 저장할 때 CHID 는 파일 이름(확장자 제외, 문자·숫자·_·- 만)으로 바뀌고, 결과는 <CHID>.smv, <CHID>_hrr.csv 로 나옵니다."
    fix: {tools: [project_save, set_chid, sim_start], how: "원하는 CHID 를 파일 이름으로 씁니다(예: project_save {path: '…/office_fire_A.bulc'} → CHID office_fire_A). 마침표·공백은 쓰지 않습니다(FDS ERROR 108). sim_start 는 저장한 프로젝트 옆에 같은 이름의 .fds 를 쓰고 실행합니다. 구버전 앱은 사용자에게 같은 이름으로 저장하도록 안내합니다."}

  - id: GEN-010
    domain: general
    severity: error
    confidence: verified
    applies_to: [Simulation]
    title: "실행은 BULC 앱이 연결된 라이브 모드에서만 됩니다 — 실행하지 않은 결과를 말하지 않습니다"
    title_en: "Runs need the connected app (live mode); never report results you did not obtain"
    condition: "앱이 연결되지 않은 상태(스냅샷 모드)에서 해석이 실행된 것처럼 답했거나, 결과 파일·지표를 보지 않고 온도·HRR·ASET·RSET 값을 지어냈습니다. 결과 도구가 '결과가 없습니다'라고 답했는데 값을 보고했습니다."
    check: {tools: [bulc_connection_status, sim_status, results_detect, get_simulation_metrics], how: "sim_status 로 실행 중·종료·건강 지표(nan=0, Tmax ≤ 2500 K, |u| < 50 m/s)를 봅니다. results_detect 가 결과 파일 목록을 돌려줍니다. 연결되지 않았으면 사용자에게 앱 실행을 요청합니다."}
    fix: {tools: [sim_preflight, sim_start, sim_status, fire_results_summary, fire_timeseries, fire_compute_aset, evac_get_results, run_simulation], how: "BULC 0.89 이상: sim_preflight → 조건 요약·사용자 확인 → sim_start {confirm: true} → sim_status 를 주기적으로 → 끝나면 fire_results_summary · fire_timeseries · fire_compute_aset 이 돌려준 값만 보고합니다. 피난은 evac_get_results. 구버전 앱(이 도구들이 없음): run_simulation(이 서버가 validate_project 뒤 실행) 후 앱 결과 화면에서 사용자가 확인합니다."}

  - id: GEN-011
    domain: general
    severity: warning
    confidence: convention
    applies_to: [Fire, Reaction, Nozzle, WaterSource, AsetCriteria]
    title: "설계값을 지어내지 않습니다 — 근거를 묻거나 가정으로 표시합니다"
    title_en: "Do not invent design values; ask or label assumptions"
    condition: "화원 크기, 연료 수율, 노즐 K, 요구 방사압, 수원 압력, 재실자 수를 근거 없이 정했습니다."
    fix: {how: "사용자·도면·사양서에서 값을 받습니다. 없으면 출처 있는 대표값을 쓰고 '가정'으로 보고서·응답에 명시합니다."}

  - id: GEN-012
    domain: general
    severity: error
    confidence: convention
    applies_to: [Drawing]
    title: "고객 도면과 결과는 로컬에서만 다룹니다"
    title_en: "Keep customer drawings and results local"
    condition: "도면 파일이나 그 내용(라인 번호·태그·치수)을 외부 서비스나 공개 저장소로 보냈습니다."
    fix: {how: "도면은 절대 경로로 도구에 넘기고, 공유가 필요하면 사용자가 직접 판단하게 합니다. 예시가 필요하면 합성 예제를 만듭니다."}

  - id: GEN-013
    domain: general
    severity: warning
    confidence: verified
    applies_to: [all]
    title: "도구 응답의 경고(⚠, Warning)를 읽고 처리합니다"
    title_en: "Act on warnings inside tool replies"
    condition: "도구가 성공 문구 뒤에 경고(예: 'no reaction fuel is set', '유량 0', 무시된 인자)를 붙였는데 다음 단계로 넘어갔습니다."
    fix: {how: "경고가 가리키는 도구를 바로 호출해 해소합니다."}

  - id: GEN-014
    domain: general
    severity: warning
    confidence: verified
    applies_to: [Project]
    title: "프로젝트 열기·저장은 project_* 도구로 합니다 — 다른 서버의 파일 도구 이름을 쓰지 않습니다"
    title_en: "Open and save projects with the project_* tools; do not use other servers' file-tool names"
    condition: "new_project / open_project / save_project / export_fds / import_fds 를 불렀습니다. 이 이름은 앱과 연결되지 않은 별도 세션(비공개 헤드리스 서버)의 도구라, 앱에서 고친 내용이 아닌 다른 프로젝트를 저장할 수 있습니다. BULC 앱(0.89 이상)의 파일 도구는 project_new / project_open / project_save / project_export_fds 이며 실행 중인 앱의 현재 프로젝트에 작용합니다. 0.88 이하 앱에는 파일 도구가 없습니다(Unknown tool). 저장되지 않은 편집을 버리는 discard_unsaved, 기존 파일을 바꾸는 overwrite 는 사용자 확인 없이 쓰면 작업을 잃습니다."
    check: {tools: [project_info, bulc_connection_status], how: "project_info 가 현재 파일 경로·저장되지 않은 변경(isDirty)·층·덱 경로를 돌려줍니다. tools/list 에 project_* 가 있는지 먼저 봅니다."}
    fix: {tools: [project_open, project_save, project_export_fds, project_new], how: "열기: project_open {path: 절대 경로(.bulc 또는 .fds)}. 저장: project_save {path?: '….bulc'} — 덱만 필요하면 project_export_fds {path: '….fds'}. 저장하지 않은 변경이 있으면 먼저 사용자에게 저장할지 묻고, discard_unsaved·overwrite 는 사용자가 동의한 뒤에만 true 로 줍니다. 구버전 앱(project_* 없음): 사용자에게 앱의 파일 메뉴에서 열기·저장을 요청합니다. run_simulation 은 프로젝트 저장과 별개로 문서 폴더의 bulc_<folder_name> 에 .fds 를 씁니다."}

  - id: GEN-015
    domain: general
    severity: warning
    confidence: convention
    applies_to: [Fire]
    title: "사용자가 지시하지 않으면 화원을 만들지 않습니다"
    title_en: "Add a fire source only when the user asks for one"
    condition: "사용자가 화재 시나리오(위치·크기·성장)를 말하지 않았는데 add_fire 나 화재 프리셋 가구·is_fire_source 로 화원을 만들었습니다. 화원 하나가 결과 전체를 결정합니다."
    check: {tools: [get_project_summary, list_obstacles], how: "요약의 fireSources 수와 사용자 지시를 대조합니다."}
    fix: {tools: [remove_fire], how: "화원 위치·최대 HRR·성장 곡선·연료를 사용자에게 묻고, 받은 값으로만 만듭니다. 예시가 필요하면 '가정' 이라고 밝히고 승인을 받습니다."}

  - id: GEN-016
    domain: general
    severity: error
    confidence: convention
    applies_to: [Simulation, Project]
    title: "실행 전: 점검 → 수정 → 조건 요약 → 사용자 확인 → 실행"
    title_en: "Before running: validate, fix, summarize the conditions, get the user's go-ahead, then run"
    condition: "sim_preflight(또는 validate_project)를 돌리지 않았거나 오류가 남은 채로, 또는 사용자에게 해석 조건(격자·화원·시간·출력·엔진)을 알리지 않은 채 sim_start / run_simulation 을 불렀습니다. 사용자가 동의하지 않았는데 sim_start 에 confirm=true 를 넣었거나, 점검 오류를 force=true 로 무시했습니다. 해석은 몇 분에서 몇 시간 GPU 를 점유합니다."
    check: {tools: [sim_preflight, validate_project, get_config_summary, get_simulation_settings], how: "sim_preflight 는 validate_project 에 출력 주기·덱 참조·화원 위치·격자 해상도 점검을 더한 구조화 결과(규칙 ID 포함)를 돌려줍니다. ok=false 면 실행하지 않습니다."}
    fix: {tools: [sim_preflight, sim_start, sim_status, run_simulation], how: "BULC 0.89 이상: sim_preflight 의 오류를 0 건으로 만든 뒤 조건(셀 수·화원·T_END·출력·엔진)을 요약해 사용자 확인을 받고 sim_start {confirm: true} 를 부릅니다. sim_start 는 직전에 점검을 다시 돌려 오류가 있으면 실행하지 않으며, force=true 는 사용자가 오류를 알고도 실행하겠다고 할 때만 씁니다. 진행은 sim_status. 구버전 앱: validate_project → 확인 → run_simulation(이 서버가 validate_project 를 다시 돌려 오류가 있으면 실행하지 않음)."}

  - id: GEN-017
    domain: general
    severity: warning
    confidence: convention
    applies_to: [Project]
    title: "전용 도구를 먼저 쓰고, 덱 원문 편집은 preview_fds → fds_apply_text(dryRun) 로 합니다"
    title_en: "Prefer dedicated tools; edit raw deck text with preview_fds → fds_apply_text (dryRun first)"
