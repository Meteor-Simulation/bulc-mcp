    condition: "add_fire XB 의 z1 = z2 가 바닥(영역 바닥 또는 슬래브 윗면)이나 물체 윗면과 일치하지 않아 공중에 떠 있습니다."
    fix: {tools: [update_fire], how: "지상층은 z=영역 바닥(보통 0), 윗층은 그 층 zMin, 물체 위 화원은 물체 윗면 z."}

  - id: FIRE-003
    domain: fire
    severity: error
    confidence: verified
    applies_to: [Fire, Reaction]
    title: "HRRPUA 화원이 있으면 반응(&REAC FUEL)을 지정합니다"
    title_en: "A HRRPUA fire needs a reaction fuel"
    condition: "연료를 지정하지 않아 덱에 &REAC 이 없습니다. FDS 6.10.1 은 ERROR(314) 로 멈춥니다."
