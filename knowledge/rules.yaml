  - id: FIRE-004
    domain: fire
    severity: warning
    confidence: verified
    applies_to: [Fire, Ramp]
    title: "t² 성장 프리셋은 '이 화원의 최대치'에 time_to_peak 에 닿습니다"
    title_en: "The t-squared preset reaches this fire's peak at time_to_peak"
    condition: "growth='fast' 만 주고 기본 time_to_peak(slow 600, medium 300, fast 150, ultrafast 75 s)를 그대로 썼습니다. 이 기본값은 1,055 kW 에 닿는 NFPA 시간이므로, 최대 HRR 이 다르면 성장 계수 α 가 달라집니다."
    fix: {tools: [add_fire, update_fire], how: "t_peak = √(Q_peak / α), α = slow 0.00293, medium 0.01172, fast 0.0469, ultrafast 0.1876 kW/s². 예: fast 3 MW → 253 s, fast 5 MW → 327 s, medium 2 MW → 413 s."}

