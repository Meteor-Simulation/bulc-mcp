common_mistakes:
  - id: LLM-001
    mistake: "HRR(kW)을 hrrpua 에 그대로 넣음"
    consequence: "화원 크기가 면적배로 틀어짐"
    correct: "hrrpua = HRR / 면적, add_fire 응답의 total HRR 확인"
    rules: [FIRE-001]
  - id: LLM-002
    mistake: "도면 mm 좌표를 m 로 변환하지 않음"
    consequence: "건물이 1,000배 커져 영역 밖으로 사라짐"
    correct: "× 0.001, 축척 확인 후 입력"
    rules: [GEN-001, DRW-001]
  - id: LLM-003
    mistake: "높이를 y 에, 평면 세로를 z 에 넣음"
    consequence: "건물이 옆으로 누움"
    correct: "z = 연직"
    rules: [GEN-002]
  - id: LLM-004
    mistake: "XB 를 [x1,y1,z1,x2,y2,z2] 로 씀"
    consequence: "엉뚱한 크기·위치의 장애물"
    correct: "[x1,x2,y1,y2,z1,z2]"
    rules: [GEN-003]
  - id: LLM-005
    mistake: "윗층 벽·장치를 z=0 기준으로 만듦(층 zMin 무시)"
    consequence: "모든 층이 1층에 겹치고, 앱에서 해당 층을 보면 객체가 '안 보임'"
    correct: "draw_list_stories 의 zMin 사용"
    rules: [GEO-002, EVAC-001]
  - id: LLM-006
    mistake: "층을 쌓으며 층간 슬래브를 빠뜨림"
    consequence: "연기가 층 사이로 막힘없이 퍼짐"
    correct: "윗층마다 add_floor"
    rules: [GEO-007]
  - id: LLM-007
    mistake: "set_all_boundaries_open 을 인자 없이 호출"
    consequence: "바닥이 열리고 바닥 화원이 사라질 수 있음"
    correct: "faces 에서 ZMIN 제외"
    rules: [VENT-002]
  - id: LLM-008
    mistake: "두께 0 장애물·셀보다 좁은 문을 만듦"
    consequence: "의도치 않은 차단·누설, 문이 막힘"
    correct: "1셀 이상 두께, 문 폭 ≥ 셀 2개"
    rules: [GEO-003, GEO-005]
  - id: LLM-009
    mistake: "없는 도구를 가정(evac_add_exit, 피난 실행, ASET 계산, 건축 도면 인식)"
    consequence: "호출 실패 또는 거짓 보고"
    correct: "tools/list 확인, 앱 화면 단계로 안내"
    rules: [GEN-005, EVAC-004, DRW-004]
  - id: LLM-010
    mistake: "배관망·덕트·밸브를 고친 뒤 계산을 다시 돌리지 않음"
    consequence: "이전 결과로 보고·FDS 반영"
    correct: "spr_run_calc / hvac_run_calc 다시 실행 후 apply"
    rules: [SPR-004, HVAC-003]
  - id: LLM-011
    mistake: "US K(5.6)를 미터 K 자리에 넣음"
    consequence: "유량이 1/14 로 과소"
    correct: "× 14.41"
    rules: [SPR-010]
  - id: LLM-012
    mistake: "MPa 와 bar 혼동"
    consequence: "요구압·유량 10배 오차"
    correct: "0.1 MPa = 1 bar"
    rules: [SPR-011]
  - id: LLM-013
    mistake: "m³/h 를 CFM 자리에 넣음"
    consequence: "풍량 1.7배 과대"
    correct: "× 0.5886"
    rules: [HVAC-001]
  - id: LLM-014
    mistake: "EVAC floorIndex 에 층 id(1부터)를 넣음"
    consequence: "피난자가 한 층 위에 놓임"
    correct: "EVAC/HVAC = 0부터 순번, SPR = 층 id"
    rules: [EVAC-001]
  - id: LLM-015
    mistake: "실내 문·창을 'Door_'/'Window_' 로 만듦"
    consequence: "실내 문에서 피난 완료 처리, RSET 과소"
    correct: "창은 다른 접두어, 출구 목록 확인"
    rules: [EVAC-003]
  - id: LLM-016
    mistake: "감지기·헤드를 천장 슬래브 높이에 둠"
    consequence: "고체 셀이라 작동하지 않음"
    correct: "천장 아래 기체 셀"
    rules: [DEVC-001]
  - id: LLM-017
    mistake: "출력 주기가 T_END 이상"
    consequence: "t=0 한 장만 저장"
    correct: "DT_* < T_END"
    rules: [OUT-001]
  - id: LLM-018
    mistake: "GPU 미지원 SLCF/DEVC 수량을 씀"
    consequence: "TEMPERATURE 로 대체되거나 0 열"
    correct: "지원 목록 확인"
    rules: [OUT-002, DEVC-002]
  - id: LLM-019
    mistake: "화원 tmp_front 기본값(300)을 의식하지 않음"
    consequence: "버너 면이 300 °C 로 고정되어 복사를 냄"
    correct: "의도가 아니면 tmp_front=20"
    rules: [FIRE-006]
  - id: LLM-029
    mistake: "set_fds_properties 의 fire_faces 에 면 이름 문자열을 넣음"
    consequence: "−X 면만 타는 화원"
    correct: "불린 6개 [-X,+X,-Y,+Y,-Z,+Z]"
    rules: [FIRE-013]
  - id: LLM-030
    mistake: "장애물 화원에 ramp_points 만 주고 ramp_id 를 빠뜨림"
    consequence: "처음부터 최대 HRR"
    correct: "ramp_id 와 ramp_points 를 함께"
    rules: [FIRE-014]
  - id: LLM-031
    mistake: "자동 배치 배관망을 관경 조정 없이 보고"
    consequence: "유속·압력 등급 초과, 과대 펌프"
    correct: "검토 결과로 관경·수원을 고치고 재계산"
    rules: [SPR-016, SPR-017]
  - id: LLM-020
    mistake: "t² 프리셋 기본 시간을 최대 HRR 과 무관하게 씀"
    consequence: "성장 계수 α 가 의도와 다름"
    correct: "t_peak = √(Q/α)"
    rules: [FIRE-004]
  - id: LLM-021
    mistake: "validate_project 를 건너뛰고 '완료'라고 보고"
    consequence: "실행 단계에서 ERROR 314/1020/938 등으로 멈춤"
    correct: "편집 묶음마다, 저장·실행 전 필수"
    rules: [GEN-006]
  - id: LLM-022
    mistake: "실행하지 않은 결과(온도, ASET)를 지어냄"
    consequence: "거짓 보고"
    correct: "지표·결과 파일을 읽은 값만 보고"
    rules: [GEN-010]
  - id: LLM-023
    mistake: "생성 id(배관·HVAC·피난 노드)를 짐작"
    consequence: "잘못된 노드 연결 또는 실패"
    correct: "요약 도구로 id 읽기"
    rules: [GEN-008]
  - id: LLM-024
    mistake: "단일 메시 도구로 다중 메시를 덮어씀"
    consequence: "auto_multimesh 결과가 사라짐"
    correct: "set_meshes / slice_mesh / merge_meshes"
    rules: [MESH-004]
  - id: LLM-025
    mistake: "HVAC 단말을 기본 0.2 m 그대로 두고 큰 풍량 적용"
    consequence: "수십 m/s 제트, 수치 불안정"
    correct: "단말을 실제 크기로 키움"
    rules: [HVAC-004]
  - id: LLM-026
    mistake: "같은 배관 도면을 두 번 가져옴(append)"
    consequence: "배관망 이중"
    correct: "mode='replace'"
    rules: [DRW-009]
  - id: LLM-027
    mistake: "배관망 헤드를 add_sprinkler 로도 또 만듦"
    consequence: "FDS 헤드 이중"
    correct: "spr_apply_to_fds 한 경로"
    rules: [SPR-020]
  - id: LLM-028
    mistake: "법규 값을 확정 사실처럼 단정"
    consequence: "개정 기준과 불일치"
    correct: "regulatory_verify 규칙은 '원문 확인 필요'로 표시"
    rules: [ASET-002, SPR-050, SPR-053, ASET-006]
  - id: LLM-032
    mistake: "사용자가 말하지 않은 화원을 '예시로' 넣음"
    consequence: "결과 전체가 가정 하나로 정해짐"
    correct: "화원 위치·크기·성장·연료를 묻고 받은 값으로만 add_fire"
    rules: [GEN-015, GEN-011]
  - id: LLM-033
    mistake: "new_project / save_project / export_fds 같은 다른 서버의 파일 도구 이름을 씀"
    consequence: "Unknown tool, 또는 앱이 아닌 세션이 저장됨"
    correct: "project_open / project_save / project_export_fds(구버전 앱은 파일 메뉴 안내), 실행은 sim_preflight → sim_start"
    rules: [GEN-014, GEN-005]
  - id: LLM-034
    mistake: "'앱에 연결할 수 없습니다' 오류 뒤에도 작업이 끝났다고 보고"
    consequence: "아무것도 바뀌지 않았는데 완료로 보고"
    correct: "bulc_connection_status 확인 → 사용자에게 앱 실행 요청"
    rules: [GEN-018, GEN-010]
  - id: LLM-035
    mistake: "조건 요약·사용자 확인 없이 바로 sim_start {confirm: true} / run_simulation"
    consequence: "잘못된 조건으로 GPU 를 오래 점유, 결과 덮어씀"
    correct: "sim_preflight → 조건 요약 → 확인 → sim_start(시나리오마다 다른 파일 이름)"
    rules: [GEN-016, GEN-019]
  - id: LLM-036
    mistake: "스프링클러 헤드·HVAC 단말 노드를 label 없이 연달아 만듦"
    consequence: "구버전 앱에서 &DEVC·&OBST ID 중복, 새 앱에서도 읽기 어려운 ID"
    correct: "spr_add_node / hvac_add_node 마다 겹치지 않는 label(H1, H2 …)"
    rules: [GEN-021]
  - id: LLM-037
    mistake: "evac_run 직후 evac_get_results 를 읽고 RSET 을 보고"
    consequence: "이전 실행 결과(또는 결과 없음)를 이번 결과로 보고"
    correct: "evac_status 가 끝났다고 할 때까지 기다린 뒤 evac_get_results"
    rules: [EVAC-004, GEN-010]
  - id: LLM-038
    mistake: "건축 평면을 arch_import_building dryRun:false 로 바로 만들거나 문·창 wall 번호를 0 부터 셈"
    consequence: "축척·층이 틀린 건물, 말없이 빠진 문"
    correct: "arch_analyze_drawing → 질문 확인 → dryRun(기본) → 동의 후 dryRun:false, wall 은 1 부터"
    rules: [DRW-004, DRW-003]
