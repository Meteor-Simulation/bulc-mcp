  # ═════════════════════════ FIRE / REACTION ═════════════════════════
  - id: FIRE-001
    domain: fire
    severity: error
    confidence: verified
    applies_to: [Fire]
    title: "HRRPUA = 목표 HRR ÷ 화원 면적"
    title_en: "HRRPUA equals target HRR divided by burner area"
    condition: "목표 HRR(kW)을 hrrpua 에 그대로 넣었습니다. 예: 1 MW 화원을 2 m × 1 m 면에 hrrpua=1000 으로 넣으면 2 MW 가 됩니다."
    check: {tools: [add_fire], how: "add_fire 응답의 total HRR 을 목표와 비교합니다. 실행 후 <CHID>_hrr.csv 와도 비교합니다."}
    fix: {tools: [update_fire], how: "hrrpua = Q_target / ((x2−x1)(y2−y1)). 면적은 셀 격자에 맞춰지므로 면 치수를 셀 크기의 배수로 합니다."}

