# BULC / FDS 6.10.1 domain ontology for LLM agents
#
# 이 파일은 BULC MCP 서버를 조작하는 LLM 이 "무엇이 무엇과 연결되는지, 어떤 단위와 좌표를 쓰는지,
# 어떤 도구가 그 객체를 만들고 읽는지"를 한곳에서 확인하도록 만든 도메인 온톨로지입니다.
# 같은 내용의 JSON-LD 판은 ontology.jsonld 입니다(이 YAML 에서 생성).
#
# 읽는 법
#   classes.<Class>.properties  : 값의 이름·형식·단위 (단위가 없는 값은 무차원)
#   classes.<Class>.relations   : 다른 클래스로 가는 관계 (술어 → 대상 클래스)
#   classes.<Class>.tools       : 이 객체를 만들고(create)·읽고(read)·고치고(update)·지우고(delete)·점검(check)하는 MCP 도구
#   classes.<Class>.fds         : 최종 .fds 덱에서 이 객체가 되는 namelist
#   classes.<Class>.rules       : rules.yaml 의 관련 규칙 id
# 도구 이름은 서버의 tools/list 결과가 최종 기준입니다. 목록에 없는 도구를 가정하지 마십시오(GEN-005).

schema_version: 1
id: bulc-ontology
title: BULC fire / evacuation / HVAC / sprinkler domain ontology
updated: "2026-10-02"
fds_version: "6.10.1"
namespace: "urn:bulc:onto:"
languages: [ko, en]

conventions:
  units:
    length: "m (도면 DXF/DWG 는 보통 mm — 1 mm = 0.001 m)"
    duct_and_pipe_size: "mm (덕트 지름·폭·높이, 배관 호칭경)"
    time: "s"
    temperature: "°C (FDS 덱의 TMPA, TMP_FRONT, ACTIVATION_TEMPERATURE 모두 섭씨). 엔진 실행 지표 Tmax 는 K."
    heat_release_rate: "kW (HRR), kW/m² (HRRPUA = 단위 면적당 발열량)"
    heat_flux: "kW/m²"
    mass_flux: "kg/(m²·s)"
    volume_flow_fds: "m³/s (FDS VOLUME_FLOW)"
    volume_flow_hvac_module: "CFM (BULC HVAC 모듈 입력). 1 CFM = 0.000471947 m³/s, 1 m³/h = 0.5886 CFM, 1 m³/min = 35.31 CFM"
    water_flow: "L/min"
    pressure_pipe_network: "MPa (배관망 수력계산·요구 방사압·펌프). 0.1 MPa = 1 bar ≈ 10.2 m 수두"
    pressure_fds_sprinkler: "bar (FDS &PROP OPERATING_PRESSURE, add_sprinkler 의 operating_pressure)"
    pressure_hvac: "Pa"
    k_factor: "L/(min·bar^½) (미터계). 미국 gpm/psi^½ 값 × 14.41. Q = K·√P (P 는 bar)"
    rti: "(m·s)^½"
    droplet_diameter: "µm"
    yields: "kg/kg (연료 질량당 생성 질량)"
    concentrations_aset: "CO ppm, O₂·CO₂ 부피 %, 가시거리 m"
  coordinates:
    axes: "x, y = 평면(도면) 좌표, z = 연직(위가 +). FDS 와 BULC 모두 z-up 입니다."
    origin: "프로젝트 원점은 사용자가 정합니다. 도면을 옮길 때는 한 기준점(예: 도면 좌하단 기둥 중심)을 (0,0) 으로 정하고 기록합니다."
    image_y_flip: "이미지(PNG/JPG/PDF 렌더) 픽셀 좌표는 y 가 아래로 증가합니다. 모델 y = (이미지 높이 − 픽셀 y) × 축척."
    xb: "XB = [x1, x2, y1, y2, z1, z2] (각 축 min, max 쌍). [x1, y1, z1, x2, y2, z2] 순서가 아닙니다."
    point: "XYZ = [x, y, z]"
    plane: "평면(VENT, 화원 면, 경계면)은 한 축의 min = max 입니다. 예: 바닥 화원 XB=[4,5,4,5,0,0]"
    faces: "면 순서(SURF_ID6) = [-X, +X, -Y, +Y, -Z, +Z]"
    story_elevation: "층 높이 zMin 은 draw_list_stories 로 확인합니다. 기본값: 1F zMin=0, 층고 3.0 m, 층간 슬래브 0.2 m → 2F zMin=3.2 m"
  floor_identifiers:
    story_id: "draw 층 id (1부터). draw_update_story / draw_remove_story / spr_* 도구의 floorIndex·targetFloorIndex 가 이 id 를 받습니다."
    evac_floor_index: "피난(EVAC)·HVAC 도구의 floorIndex 는 층을 높이순으로 정렬한 0부터의 순번입니다(1F → 0, 2F → 1)."
    warning: "같은 이름(floorIndex)이 도구마다 다른 뜻입니다 — rules.yaml EVAC-001 참조."
  ids:
    uniqueness: "같은 namelist 그룹 안에서 ID 는 유일해야 합니다(OBST, HOLE, VENT, DEVC, CTRL, SLCF, SURF, MATL …)."
    generated_ids: "배관망(spr_*)·HVAC(hvac_*)·피난(evac_*) 노드 id 는 스토어가 만듭니다. 만든 직후 spr_list_summary / hvac_list_summary / evac_list_summary 로 id 를 읽어 다음 호출에 씁니다."
    chid: "프로젝트를 저장하면 CHID 가 저장 파일 이름으로 바뀝니다(GEN-009)."
  modes:
    snapshot: "BULC 앱이 실행 중이 아님 — 서버가 내장 도구 목록(스냅샷)만 보여 줍니다. 지식 도구(bulc_knowledge_search, bulc_get_rules, bulc_plan_check, bulc_drawing_intake, bulc_check_deck, bulc_mesh_advisor)는 동작하지만 앱 도구 호출은 '앱을 실행하세요' 오류로 끝납니다. 이 상태에서 편집·실행이 됐다고 말하지 않습니다(GEN-018)."
    live: "실행 중인 BULC 데스크톱 앱에 연결 — 편집이 화면에 바로 반영되고 프로젝트 열기·저장(project_*), 실행(sim_preflight → sim_start → sim_status), 결과 읽기(fire_*, evac_get_results), 화면 캡처(capture_view), result_* 가 동작합니다. 연결 여부·도구 집합은 bulc_connection_status 로 확인합니다. 서버는 앱의 발견 파일(BULC/bridge.json)로 주소·토큰을 찾습니다."
  app_versions:
    note: "도구 집합은 앱 버전마다 다릅니다. 실제 기준은 연결된 앱의 tools/list 입니다."
    "0.90+": "project_info/open/save/new/export_fds/undo/redo, get_conventions, fds_apply_text, sim_preflight/start/status/stop/log_tail, results_detect, fire_results_summary/timeseries/compute_aset, output_add_tenability_slices, capture_view, evac_run/status/stop/get_results, arch_analyze_drawing/import_building/import_floorplan_report"
    "0.88 이하": "위 도구가 없습니다 — 열기·저장은 앱 파일 메뉴, 실행은 run_simulation(이 서버의 가드), 피난 실행·결과는 앱 EVAC 탭, 건축 평면은 bulc_drawing_intake 의 벽 후보 + add_wall 로 합니다."
  app_only_actions:
    file_menu: "BULC 0.90 이상은 project_open / project_save / project_export_fds / project_new 로 앱의 현재 프로젝트를 열고 저장합니다(저장 안 된 변경·덮어쓰기는 사용자 확인 뒤). 그 이전 앱은 사용자가 앱의 파일 메뉴에서 합니다. new_project / open_project / save_project / export_fds 는 다른 서버의 이름입니다(GEN-014)."
    evacuation_run: "피난 실행은 evac_run → evac_status → evac_get_results(0.90+). FED 연계·경보 연동 설정은 앱 EVAC 탭에서 사용자가 켭니다 — 켠 설정은 evac_run 입력에 들어갑니다(EVAC-004)."
    architectural_drawing: "건축 평면 인식은 arch_analyze_drawing → arch_import_building(0.90+), 그림은 arch_import_floorplan_report. 앱 2D 편집기의 CAD 배경 기능은 사용자가 화면에서 쓰는 다른 경로입니다(DRW-004)."

areas:
  core: [Project, Story, Simulation, Ramp]
  geometry: [Mesh, Obstacle, Wall, Slab, Opening, Door, Window, Hole, FurnitureItem, Shape, Geom, Surface, Material]
  boundaries: [Vent, OpenBoundary, SupplyExhaustVent]
  fire: [Fire, Reaction, Species]
  devices: [Device, Thermocouple, HeatDetector, SmokeDetector, SprinklerDevice, Prop, Control]
  outputs: [Output, Slice, BoundaryOutput, Plot3D, Smoke3D, DeviceCsv, DumpSettings]
  evacuation: [EvacSetup, Agent, Exit, Stair, Waypoint, Journey, FedCoupling, Alarm]
  hvac: [HvacNetwork, HvacNode, Duct, AirHandler, SupplyDiffuser, ExhaustGrille, HvacTerminal]
  sprinkler: [PipeNetwork, PipeNode, Pipe, Fitting, Valve, Riser, Drain, Nozzle, WaterSource, DelugeZone, SprayProfile, DesignScenario, PumpSpec, ReviewFinding, ExportBundle]
  results: [HrrCurve, RuntimeMetrics, AsetCriteria, AsetResult, RsetEstimate, PipeResults, HvacResults]
  drawings: [Drawing, ArchitecturalPlan, SprinklerPlan, PipingIsometric, DrawingCandidate]

classes:

  # ───────────────────────── core ─────────────────────────
  Project:
    label: {en: Project, ko: 프로젝트}
    description: "하나의 해석 단위. .bulc 번들(.fds 텍스트 + 피난·배관망·HVAC 상태 JSON)로 저장합니다."
    fds: ["&HEAD CHID, TITLE"]
    properties:
      chid: {type: string, note: "출력 파일 이름 접두어. 마침표·공백 불가. 저장 시 파일 이름으로 정규화"}
      title: {type: string}
      file_path: {type: path, note: ".bulc 또는 .fds 절대 경로"}
    relations:
      hasStory: Story
      hasMesh: Mesh
      hasSimulation: Simulation
      hasObstacle: Obstacle
      hasVent: Vent
      hasFire: Fire
      hasDevice: Device
      hasOutput: Output
      hasEvacSetup: EvacSetup
      hasPipeNetwork: PipeNetwork
      hasHvacNetwork: HvacNetwork
      importedFrom: Drawing
    tools:
      read: [project_info, get_project_summary, get_config_summary, get_simulation_settings, preview_fds, get_conventions]
      file: [project_open, project_save, project_new, project_export_fds]
      update: [set_chid, fds_apply_text, project_undo, project_redo]
      check: [validate_project, sim_preflight, bulc_check_deck]
      run: [sim_start, run_simulation]
      view: [capture_view]
    app_actions: "0.88 이하 앱은 새로 만들기·열기·저장을 앱 파일 메뉴에서 합니다(conventions.app_only_actions.file_menu)"
    rules: [GEN-006, GEN-009, GEN-010, GEN-014, GEN-016, GEN-017]

  Story:
    label: {en: Story, ko: 층}
    description: "건물 층. 2D 편집과 층 단위 표시·배관망 층 판정·피난 층 판정의 기준입니다. FDS 덱에는 층 개념이 없고 z 좌표만 있습니다."
    properties:
      id: {type: integer, note: "1부터. 1F = 1"}
      name: {type: string, note: "기본 '<id>F'"}
      zMin: {type: number, unit: m, note: "층 바닥 윗면 높이"}
      height: {type: number, unit: m, note: "층고(바닥 윗면 → 천장 아랫면). 기본 3.0"}
    relations:
      containsWall: Wall
      containsSlab: Slab
      containsAgent: Agent
      containsPipeNode: PipeNode
      containsHvacNode: HvacNode
      connectedBy: Stair
    tools:
      create: [draw_add_story]
      read: [draw_list_stories]
      update: [draw_update_story, draw_set_wall_params, draw_set_door_params, draw_set_window_params]
      delete: [draw_remove_story]
    rules: [GEO-002, GEO-007, EVAC-001]

  Simulation:
    label: {en: Simulation settings, ko: 해석 설정}
    description: "시간·해석 모드·난류 모델·수치 안정·주변 대기·실행 엔진 선택."
    fds: ["&TIME", "&MISC", "&RADI", "&PRES", "&COMB"]
    properties:
      t_begin: {type: number, unit: s, default: 0}
      t_end: {type: number, unit: s, note: "기본 프로젝트 10 s — 실제 해석에서는 반드시 다시 지정"}
      simulation_mode: {type: enum, values: [LES, VLES, SVLES, DNS], note: "BULC 는 LES 를 씁니다. FDS 6.10.1 의 미지정 기본값은 VLES"}
      turbulence_model: {type: enum, values: [DEARDORFF, VREMAN, WALE, CONSTANT_SMAGORINSKY]}
      dt: {type: number, unit: s}
      lock_time_step: {type: boolean, note: "true 면 dt 필수"}
      cfl_max: {type: number}
      tmpa: {type: number, unit: "°C", default: 20}
      humidity: {type: number, unit: "%", default: 40}
      solver_type: {type: enum, values: [gpu, gpu_cutcell, cpu_openmp], note: "gpu = 기본 GPU 엔진, gpu_cutcell = 컷셀 엔진(베타), cpu_openmp = FDS 6.10.1 CPU"}
    relations:
      appliesTo: Project
      writes: Output
    tools:
      update: [set_time, set_simulation_mode, set_turbulence_model, set_numerics, set_ambient, set_run_options, add_raw_namelist, remove_raw_namelist]
      read: [get_simulation_settings, get_numerics, list_raw_namelists]
      check: [sim_preflight]
      run: [sim_start, sim_stop, run_simulation]
      monitor: [sim_status, sim_log_tail, get_simulation_metrics]
    rules: [SIM-001, SIM-002, SIM-003, SIM-007, SIM-009, FIRE-005, GEN-016]

  Ramp:
    label: {en: Ramp, ko: 램프(시간 함수)}
    description: "시간에 따른 비율 곡선. 화원 HRR 성장, 급배기 기동, 노즐 유량 등에 씁니다."
    fds: ["&RAMP ID, T, F"]
    properties:
      id: {type: string}
      points: {type: "array of [t, f]", unit: "s, 0–1 비율"}
    relations:
      usedBy: [Fire, Surface, SprayProfile, HvacTerminal]
    tools:
      create: [add_ramp, add_fire]
      update: [update_ramp]
      delete: [remove_ramp]
    rules: [FIRE-004, FIRE-008]

  # ───────────────────────── geometry ─────────────────────────
  Mesh:
    label: {en: Mesh, ko: 계산 격자}
    description: "계산 영역과 셀. 단일 메시 또는 정육면체 셀의 다중 메시. 메시 밖의 물체·화원·장치는 계산에서 빠집니다."
    fds: ["&MESH IJK, XB"]
    properties:
      xb: {type: XB, unit: m}
      ijk: {type: "[ni, nj, nk]"}
      cell_size: {type: number, unit: m, note: "dx = (x2−x1)/ni. 셀은 정육면체에 가깝게(비 ≤ 2)"}
    relations:
      contains: [Obstacle, Vent, Fire, Device]
      boundedBy: OpenBoundary
    tools:
      create: [set_mesh, set_mesh_cell_size, auto_fit_mesh, set_meshes, auto_multimesh, auto_cutcell_mesh]
      read: [list_meshes, get_config_summary]
      update: [slice_mesh, merge_meshes]
      check: [validate_project, bulc_mesh_advisor, bulc_check_deck]
    rules: [MESH-001, MESH-002, MESH-003, MESH-004, MESH-005, MESH-006, MESH-007, MESH-008]

  Obstacle:
    label: {en: Obstruction, ko: 장애물(고체)}
    description: "직육면체 고체. 벽·바닥·천장·가구·기둥이 모두 장애물입니다. 셀 격자에 맞춰 계단 근사됩니다."
    fds: ["&OBST ID, XB, SURF_ID / SURF_IDS / SURF_ID6"]
    properties:
      id: {type: string}
      xb: {type: XB, unit: m}
      surf_ids: {type: "string[]", note: "1개 = 전 면, 3개 = 윗면/옆면/아랫면, 6개 = 면별"}
      is_fire_source: {type: boolean}
      fds_override: {type: object, note: "화원·감지기·스프링클러·HVAC 프리셋 등 런타임 FDS 속성(get_object_properties 로 확인)"}
    relations:
      usesSurface: Surface
      hasOpening: Hole
      onStory: Story
    tools:
      create: [add_obstacle, add_wall, add_floor, place_furniture, shape_export_obst]
      read: [list_obstacles, get_object_properties]
      update: [update_obstacle, transform_obstacle, set_fds_properties, assign_surface]
      delete: [remove_obstacle]
    rules: [GEO-003, GEO-005, GEO-006, GEN-003]

  Wall:
    label: {en: Wall, ko: 벽}
    parent: Obstacle
    description: "두 점과 높이·두께로 만드는 장애물. 대각 벽은 경계 상자 하나로 만들어지므로 대각 벽은 짧은 직교 벽 여러 개로 나눕니다."
    properties:
      start: {type: "[x, y]", unit: m}
      end: {type: "[x, y]", unit: m}
      height: {type: number, unit: m, default: 3.0}
      thickness: {type: number, unit: m, default: 0.2}
      z_base: {type: number, unit: m, default: 0, note: "윗층 벽은 그 층의 zMin"}
    relations:
      hasOpening: [Door, Window, Hole]
    tools:
      create: [add_wall]
      update: [update_obstacle, transform_obstacle]
    rules: [GEO-002, GEO-003, GEO-014]

  Slab:
    label: {en: Floor / ceiling slab, ko: 바닥·천장 슬래브}
    parent: Obstacle
    description: "수평 판. add_floor 의 z 는 슬래브 윗면이고 두께만큼 아래로 생깁니다([z−t, z])."
    properties:
      z: {type: number, unit: m, note: "슬래브 윗면"}
      thickness: {type: number, unit: m, default: 0.2}
    relations:
      separates: Story
      hasOpening: Hole
    tools:
      create: [add_floor]
    rules: [GEO-001, GEO-007, GEO-008]

  Opening:
    label: {en: Opening, ko: 개구부}
    description: "장애물을 뚫는 구멍(HOLE). 문·창·슬래브 개구부·계단 개구부가 모두 여기에 속합니다."
    fds: ["&HOLE ID, XB"]
    relations:
      cuts: Obstacle
    rules: [GEO-004, GEO-013]

  Door:
    label: {en: Door, ko: 문}
    parent: Opening
    description: "벽을 관통하는 HOLE. 피난 계산은 ID 가 'Door_' 로 시작하는 HOLE 만 통로이자 출구로 봅니다."
    properties:
      id: {type: string, note: "피난 출구로 쓸 문은 'Door_' 접두어"}
      wall_id: {type: string}
      position: {type: number, note: "벽을 따라 0–1"}
      width: {type: number, unit: m, default: 0.9}
      height: {type: number, unit: m, default: 2.1}
    relations:
      becomes: Exit
    tools:
      create: [add_door, place_furniture, arch_import_building]
      update: [update_hole]
      delete: [remove_hole]
    rules: [GEO-004, EVAC-002, EVAC-003]

  Window:
    label: {en: Window, ko: 창}
    parent: Opening
    description: "창대 높이부터 뚫린 HOLE — 열린 창입니다. 닫힌 창은 HOLE 을 만들지 않습니다. ID 가 'Window_' 면 피난 출구가 되므로(EVAC-003) 출구가 아닌 창은 'Win_' 를 씁니다 — arch_import_building 은 창을 'Win_…' 로 만듭니다."
    properties:
      id: {type: string, note: "'Win_…' 권장 ('Window_…' 는 피난 출구)"}
      sill_height: {type: number, unit: m, default: 0.9}
      width: {type: number, unit: m, default: 1.2}
      height: {type: number, unit: m, default: 1.2}
    tools:
      create: [add_window, arch_import_building]
    rules: [GEO-013, EVAC-003]

  Hole:
    label: {en: Hole, ko: 개구부(일반)}
    parent: Opening
    properties:
      id: {type: string}
      xb: {type: XB, unit: m, note: "뚫을 장애물 두께보다 약간 크게"}
    tools:
      create: [add_hole]
      update: [update_hole]
      delete: [remove_hole]
    rules: [GEO-004, GEO-008]

  FurnitureItem:
    label: {en: Furniture / item, ko: 가구·품목}
    parent: Obstacle
    description: "카탈로그 품목. 화재 데이터가 있는 품목은 배치 시 화원이 될 수 있고, 문·창 품목은 가까운 벽에 붙어 HOLE 을 만듭니다."
    properties:
      furniture_id: {type: string}
      as_fire_source: {type: boolean}
    tools:
      read: [list_furniture_catalog, get_furniture_info]
      create: [place_furniture]
    rules: [GEO-011, GEO-012, FIRE-012]

  Shape:
    label: {en: Shape Studio solid, ko: 형상 스튜디오 입체}
    description: "곡면·경사·복합 형상을 CSG 로 만들고 OBST(복셀) 또는 GEOM(삼각망)으로 내보냅니다."
    relations:
      exportsTo: [Obstacle, Geom]
    tools:
      create: [shape_new_document, shape_add_box, shape_add_cylinder, shape_add_sphere, shape_add_cone, shape_add_torus, shape_add_wedge, shape_add_polygon_prism, shape_add_revolve, shape_add_arch, shape_extrude_sketch, shape_import_mesh]
      update: [shape_boolean, shape_transform, shape_mirror, shape_array, shape_hull, shape_set_params, shape_edit_node, shape_push_pull, shape_undo]
      read: [shape_get_tree, shape_preview_voxels, shape_screenshot]
      export: [shape_export_obst, shape_export_geom, shape_export_stl, shape_export_obj, shape_register_item]
      delete: [shape_delete_node]
    rules: [GEO-009, GEO-010]

  Geom:
    label: {en: GEOM triangulated surface, ko: GEOM 삼각망}
    description: "&GEOM 삼각형 면. 계단 근사 없이 곡면을 표현하지만 수밀(watertight) 면이어야 합니다."
    fds: ["&GEOM"]
    tools:
      create: [shape_export_geom]
      read: [list_geoms]
      delete: [remove_geom]
    rules: [GEO-010]

  Surface:
    label: {en: Surface, ko: 표면 경계조건}
    description: "고체 면의 열·연소·분출 경계조건. 재료 층(MATL)을 가질 수 있습니다. INERT, OPEN, MIRROR 는 예약 ID 입니다."
    fds: ["&SURF"]
    properties:
      id: {type: string}
      hrrpua: {type: number, unit: "kW/m²"}
      tmp_front: {type: number, unit: "°C"}
      layers: {type: "array", note: "두께 m + 재료 질량분율"}
    relations:
      hasLayer: Material
      usesRamp: Ramp
    tools:
      create: [add_surface, add_surface_from_library]
      read: [list_surfaces]
      update: [update_surface, assign_surface]
      delete: [remove_surface]
    rules: [SURF-001, SURF-002, SIM-011]

  Material:
    label: {en: Material, ko: 재료}
    fds: ["&MATL"]
    properties:
      density: {type: number, unit: "kg/m³"}
      conductivity: {type: number, unit: "W/(m·K)"}
      specific_heat: {type: number, unit: "kJ/(kg·K)"}
    tools:
      create: [add_material, add_material_from_library]
      read: [list_material_library]
      update: [update_material]
      delete: [remove_material]
    rules: [SURF-001]

  # ───────────────────────── boundaries ─────────────────────────
  Vent:
    label: {en: Vent, ko: 벤트(경계 패치)}
    description: "고체 면이나 영역 경계 위의 평면 패치. 열린 경계(OPEN), 급배기, 버너(화원 면) 등을 표현합니다."
    fds: ["&VENT ID, XB, SURF_ID"]
    properties:
      xb: {type: XB, unit: m, note: "한 축이 min = max 인 평면"}
      surf_id: {type: string}
    tools:
      create: [add_vent, set_open_boundary, set_all_boundaries_open]
      read: [list_vents]
      update: [update_vent]
      delete: [remove_vent]
    rules: [VENT-001, VENT-002, VENT-004, VENT-005, VENT-007]

  OpenBoundary:
    label: {en: Open boundary, ko: 개방 경계}
    parent: Vent
    description: "SURF_ID='OPEN' 벤트. 외기와 통하는 면. 영역 바닥(ZMIN)은 보통 열지 않습니다."
    properties:
      face: {type: enum, values: [XMIN, XMAX, YMIN, YMAX, ZMIN, ZMAX]}
    relations:
      becomes: Exit
    tools:
      create: [set_open_boundary, set_all_boundaries_open, add_vent]
    rules: [VENT-001, VENT-002, VENT-003, EVAC-002]

  SupplyExhaustVent:
    label: {en: Supply / exhaust vent, ko: 급기·배기 벤트}
    parent: Vent
    description: "유속·유량을 주는 면. BULC 에서는 HVAC 모듈의 단말을 hvac_apply_to_fds 가 HVAC 장애물(아랫면 급기/배기)로 만듭니다."
    tools:
      create: [hvac_apply_to_fds, set_fds_properties, add_vent]
    rules: [HVAC-003, HVAC-004, VENT-005]

  # ───────────────────────── fire ─────────────────────────
  Fire:
    label: {en: Fire source, ko: 화원}
    description: "HRRPUA 를 가진 면. 바닥이나 물체 윗면 위의 평면(z1 = z2)으로 만듭니다. 총 HRR = HRRPUA × 면적."
    fds: ["&SURF HRRPUA, RAMP_Q", "&VENT 또는 &OBST 면"]
    properties:
      hrrpua: {type: number, unit: "kW/m²"}
      xb: {type: XB, unit: m}
      area: {type: number, unit: "m²", note: "(x2−x1)(y2−y1)"}
      total_hrr: {type: number, unit: kW}
      growth: {type: enum, values: [slow, medium, fast, ultrafast], note: "t² 성장 프리셋"}
      time_to_peak: {type: number, unit: s}
      ramp_points: {type: "array of [t, f]"}
    relations:
      requires: Reaction
      usesRamp: Ramp
      locatedOn: [Slab, Obstacle]
      insideOf: Mesh
    tools:
      create: [add_fire, set_fds_properties, place_furniture]
      update: [update_fire]
      delete: [remove_fire]
      check: [validate_project]
    rules: [FIRE-001, FIRE-002, FIRE-003, FIRE-004, FIRE-005, FIRE-006, FIRE-010, FIRE-011, FIRE-012, FIRE-013, FIRE-014, VENT-002, SPR-018]

  Reaction:
    label: {en: Combustion reaction, ko: 연소 반응}
    description: "연료와 생성물 수율. HRRPUA 화원이 있으면 반드시 있어야 합니다(FDS ERROR 314)."
    fds: ["&REAC FUEL, SOOT_YIELD, CO_YIELD, RADIATIVE_FRACTION, HEAT_OF_COMBUSTION"]
    properties:
      fuel: {type: string, note: "PROPANE, METHANE 같은 FDS 사전 정의 종 이름, 또는 이름 + c/h/o/n 원자 수로 정의하는 연료"}
      soot_yield: {type: number, unit: "kg/kg"}
      co_yield: {type: number, unit: "kg/kg"}
      radiative_fraction: {type: number}
      heat_of_combustion: {type: number, unit: "kJ/kg"}
    tools:
      update: [update_reaction]
    rules: [FIRE-003, FIRE-007, FIRE-009]

  Species:
    label: {en: Species, ko: 화학종}
    fds: ["&SPEC"]
    tools:
      create: [add_species]
      delete: [remove_species]
    rules: [OUT-003, DEVC-007]

  # ───────────────────────── devices ─────────────────────────
  Device:
    label: {en: Device, ko: 계측 장치}
    description: "점(XYZ) 또는 영역(XB) 측정. 기체 셀 안에 있어야 의미 있는 값을 냅니다."
    fds: ["&DEVC ID, QUANTITY, XYZ | XB, PROP_ID, CTRL_ID"]
    properties:
      quantity: {type: string, note: "FDS 수량 이름(대문자). 엔진별 지원 범위가 다름"}
      xyz: {type: point, unit: m}
      xb: {type: XB, unit: m}
      spec_id: {type: string}
      setpoint: {type: number}
    relations:
      usesProp: Prop
      triggers: Control
      writes: DeviceCsv
    tools:
      create: [add_device]
      read: [list_devices]
      update: [update_device]
      delete: [remove_device]
    rules: [DEVC-001, DEVC-002, DEVC-003, DEVC-004, DEVC-005, DEVC-007, DEVC-008]

  Thermocouple:
    label: {en: Thermocouple, ko: 열전대}
    parent: Device
    tools:
      create: [add_thermocouple]
    rules: [DEVC-001]

  HeatDetector:
    label: {en: Heat detector, ko: 열감지기}
    parent: Device
    properties:
      activation_temp: {type: number, unit: "°C", default: 57}
      rti: {type: number, unit: "(m·s)^½"}
    tools:
      create: [add_heat_detector]
      update: [set_fds_properties]
    rules: [DEVC-001]

  SmokeDetector:
    label: {en: Smoke detector, ko: 연기감지기}
    parent: Device
    tools:
      create: [add_smoke_detector]
      update: [set_fds_properties]
    rules: [DEVC-001]

  SprinklerDevice:
    label: {en: FDS sprinkler head, ko: FDS 스프링클러 헤드}
    parent: Device
    description: "FDS 안의 헤드 = DEVC(SPRINKLER LINK TEMPERATURE) + PROP + PART(물방울). 배관망 헤드는 spr_apply_to_fds 가 계산 유량·압력으로 만듭니다."
    properties:
      activation_temperature: {type: number, unit: "°C", default: 68}
      rti: {type: number, unit: "(m·s)^½", default: 100}
      k_factor: {type: number, unit: "L/(min·bar^½)", default: 80}
      operating_pressure: {type: number, unit: bar, default: 1.0}
      orientation: {type: vector, default: "[0, 0, -1]"}
    relations:
      derivedFrom: Nozzle
      usesProfile: SprayProfile
    tools:
      create: [add_sprinkler, spr_apply_to_fds]
      update: [spr_set_head_spray, set_fds_properties]
    rules: [SPR-010, SPR-011, SPR-012, SPR-013, SPR-015, SPR-018, SPR-020, DEVC-001, TRB-004]

  Prop:
    label: {en: Device property, ko: 장치 특성(PROP)}
    fds: ["&PROP"]
    tools:
      create: [add_prop]
      update: [update_prop]
      delete: [remove_prop]
    rules: [SPR-013]

  Control:
    label: {en: Control logic, ko: 제어 논리}
    description: "장치·다른 제어를 입력으로 받아 참/거짓을 냅니다(감지기 연동 기동, 지연, 일제살수 연동 등)."
    fds: ["&CTRL ID, FUNCTION_TYPE, INPUT_ID"]
    properties:
      function_type: {type: string, note: "ANY, ALL, NOT, TIME_DELAY, DEADBAND, PID …"}
      input_id: {type: "string[]", note: "반드시 문자열 배열"}
    relations:
      inputs: [Device, Control]
    tools:
      create: [add_control]
      update: [update_control]
      delete: [remove_control]
    rules: [DEVC-004, DEVC-006]

  # ───────────────────────── outputs ─────────────────────────
  Output:
    label: {en: Output, ko: 출력}
    description: "결과 파일. 슬라이스(.sf), 경계면(.bf), Plot3D(.q), Smoke3D(.s3d), 시계열 CSV."
    relations:
      sampledAt: [Story, Mesh]
      consumedBy: [AsetResult, FedCoupling]
    tools:
      read: [results_detect]
    rules: [OUT-001, GEN-010]

  Slice:
    label: {en: Slice file, ko: 단면 슬라이스}
    parent: Output
    fds: ["&SLCF QUANTITY, SPEC_ID, PBX | PBY | PBZ"]
    properties:
      quantity: {type: string}
      pbz: {type: number, unit: m, note: "피난 판정 단면 = 층 바닥 + 1.8 m"}
    tools:
      create: [add_slcf, output_add_tenability_slices]
      read: [list_slcf]
      update: [update_slcf]
      delete: [remove_slcf]
    rules: [OUT-002, OUT-003, OUT-006]

  BoundaryOutput:
    label: {en: Boundary file, ko: 경계면 출력}
    parent: Output
    fds: ["&BNDF QUANTITY"]
    tools:
      create: [add_bndf]
      read: [list_bndf]
      delete: [remove_bndf]
    rules: [OUT-005]

  Plot3D:
    label: {en: Plot3D, ko: 3D 전체장(Plot3D)}
    parent: Output
    fds: ["&DUMP PLOT3D_QUANTITY, PLOT3D_SPEC_ID, DT_PL3D"]
    properties:
      quantities: {type: "string[]", note: "최대 5개"}
      spec_ids: {type: "string[]", note: "VOLUME FRACTION 칸에 순서대로 대응"}
    tools:
      update: [set_plot3d_outputs, update_dump_config]
    rules: [OUT-004]

  Smoke3D:
    label: {en: Smoke3D, ko: 3D 연기 표시}
    parent: Output
    fds: ["&DUMP DT_SMOKE3D"]
    tools:
      update: [update_dump_config]

  DeviceCsv:
    label: {en: Device / HRR CSV, ko: 장치·HRR 시계열}
    parent: Output
    description: "<CHID>_devc.csv, <CHID>_hrr.csv. 파일을 직접 읽을 수 있는 클라이언트라면 이 파일로 결과를 확인합니다."
    tools:
      update: [update_dump_config]

  DumpSettings:
    label: {en: Dump intervals, ko: 출력 주기}
    fds: ["&DUMP DT_SLCF, DT_PL3D, DT_SMOKE3D, DT_BNDF, DT_DEVC, DT_HRR, DT_RESTART, NFRAMES"]
    tools:
      update: [update_dump_config]
      read: [get_simulation_settings]
    rules: [OUT-001, OUT-007]

  # ───────────────────────── evacuation ─────────────────────────
  EvacSetup:
    label: {en: Evacuation setup, ko: 피난 설정}
    properties:
      model: {type: enum, values: [CollisionFreeSpeed, SocialForce, GeneralizedCentrifugal, CollisionFreeSpeedV2]}
      simulationTime: {type: number, unit: s}
      timeStep: {type: number, unit: s}
    relations:
      hasAgent: Agent
      hasExit: Exit
      hasStair: Stair
      hasJourney: Journey
      coupledWith: FedCoupling
    tools:
      update: [evac_update_setup]
      read: [evac_list_summary]
      run: [evac_run, evac_status, evac_stop]
      results: [evac_get_results]
    app_actions: "FED 연계·경보 연동 설정은 앱 EVAC 탭(conventions.app_only_actions.evacuation_run)"
    rules: [EVAC-004, EVAC-008]

  Agent:
    label: {en: Evacuee agent, ko: 피난자}
    properties:
      x: {type: number, unit: m}
      y: {type: number, unit: m}
      floorIndex: {type: integer, note: "0부터의 층 순번(1F = 0)"}
      desiredSpeed: {type: number, unit: "m/s", default: 1.2}
      maxSpeed: {type: number, unit: "m/s", default: 1.8}
    relations:
      onStory: Story
      follows: Journey
    tools:
      create: [evac_add_agent, evac_add_agents_batch]
      update: [evac_update_agent]
      delete: [evac_remove_agent, evac_clear_agents]
    rules: [EVAC-001, EVAC-005]

  Exit:
    label: {en: Exit, ko: 출구}
    description: "피난자가 도달하면 제거되는 선분. 별도 생성 도구가 없고 피난 입력 조립 때 자동으로 정해집니다: 그 층과 겹치는 OPEN 벤트, 문 품목, ID 가 'Door_'/'Window_' 로 시작하는 HOLE('Win_' 창은 출구가 아님). fire_compute_aset 의 기본 판정점도 이 출구들입니다."
    relations:
      derivedFrom: [OpenBoundary, Door, FurnitureItem]
    tools:
      read: [project_info]
    rules: [EVAC-002, EVAC-003]

  Stair:
    label: {en: Stair, ko: 계단}
    properties:
      fromFloorIndex: {type: integer}
      toFloorIndex: {type: integer}
      x1: {type: number, unit: m}
      y1: {type: number, unit: m}
      x2: {type: number, unit: m}
      y2: {type: number, unit: m}
      widthCm: {type: number, unit: cm, default: 120}
      capacity: {type: integer, default: 20}
    relations:
      connects: Story
    tools:
      create: [evac_add_stair]
      update: [evac_update_stair]
      delete: [evac_remove_stair]
    rules: [EVAC-001, EVAC-006]

  Waypoint:
    label: {en: Waypoint, ko: 경유점}
    tools:
      create: [evac_add_waypoint]
      update: [evac_update_waypoint]
      delete: [evac_remove_waypoint]

  Journey:
    label: {en: Journey, ko: 피난 경로(여정)}
    properties:
      stages: {type: "array of {type, targetId}", note: "type = WAYPOINT | WAITING_SET | QUEUE | EXIT. 마지막은 EXIT. 계단은 단계가 아님"}
    relations:
      hasStage: [Waypoint, Exit]
    tools:
      create: [evac_add_journey]
      update: [evac_update_journey]
      delete: [evac_remove_journey]
    rules: [EVAC-007]

  FedCoupling:
    label: {en: FED fire coupling, ko: FED 화재 연계}
    description: "화재 결과의 호흡선(기본 1.8 m) 위험장(T, 소광계수, CO, CO₂, O₂)을 피난 계산에 넣어 FED 누적·감속을 반영합니다. 3D 자료(Plot3D·3D 슬라이스·Smoke3D)가 필요하고, 현재 설정은 BULC 앱의 피난 설정 화면에서 합니다(MCP 도구 없음)."
    properties:
      breathingHeight: {type: number, unit: m, default: 1.8}
      fedThreshold: {type: number, default: 1.0}
      frameInterval: {type: number, unit: s, default: 2}
    relations:
      reads: [Plot3D, Smoke3D, Slice]
    rules: [EVAC-008, OUT-004]

  Alarm:
    label: {en: Alarm chain, ko: 경보 연동}
    description: "감지기 작동 시각 + 경보 지연 + 피난 개시 소요 → 피난 개시 시각. 앱의 피난 설정 화면에서 설정합니다."

  # ───────────────────────── HVAC ─────────────────────────
  HvacNetwork:
    label: {en: HVAC duct network, ko: 공조·제연 덕트망}
    description: "덕트망 풍량 계산 모듈. FDS 에는 단말(디퓨저·그릴)만 경계 유량으로 들어갑니다(덕트 내부 유동은 FDS 로 보내지 않음)."
    relations:
      hasNode: HvacNode
      hasDuct: Duct
      yields: HvacResults
      appliesAs: HvacTerminal
    tools:
      read: [hvac_list_summary, hvac_get_results]
      run: [hvac_run_calc]
      apply: [hvac_apply_to_fds]
      update: [hvac_set_defaults]
    rules: [HVAC-001, HVAC-002, HVAC-003, HVAC-004, HVAC-005]

  HvacNode:
    label: {en: HVAC node, ko: HVAC 노드}
    properties:
      type: {type: enum, values: [junction, supply_diffuser, exhaust_grille, fan]}
      x: {type: number, unit: m}
      y: {type: number, unit: m}
      z: {type: number, unit: m, default: 3.0}
      floorIndex: {type: integer, note: "0부터의 층 순번"}
      label: {type: string, note: "급기·배기 단말은 겹치지 않게(SA1, EX1 …) — FDS &OBST ID 가 됩니다(GEN-021)"}
    tools:
      create: [hvac_add_node]
      update: [hvac_update_node]
      delete: [hvac_remove_node]
    rules: [HVAC-002, EVAC-001, GEN-021]

  Duct:
    label: {en: Duct, ko: 덕트}
    properties:
      ductShape: {type: enum, values: [circular, rectangular]}
      diameter: {type: number, unit: mm}
      width: {type: number, unit: mm}
      height: {type: number, unit: mm}
      material: {type: enum, values: [galvanized_steel, stainless_steel, aluminum, flexible]}
    relations:
      connects: HvacNode
    tools:
      create: [hvac_add_duct]
      update: [hvac_update_duct]
      delete: [hvac_remove_duct]

  AirHandler:
    label: {en: Air handler / fan, ko: 공조기·송풍기}
    properties:
      maxAirflowCFM: {type: number, unit: CFM}
      staticPressurePa: {type: number, unit: Pa}
      fanType: {type: enum, values: [supply, exhaust, return]}
    relations:
      attachedTo: HvacNode
    tools:
      create: [hvac_add_air_handler]
      update: [hvac_update_air_handler]
      delete: [hvac_remove_air_handler]

  SupplyDiffuser:
    label: {en: Supply diffuser, ko: 급기 디퓨저}
    properties:
      airflowCFM: {type: number, unit: CFM, default: 200}
      supplyTempC: {type: number, unit: "°C", default: 20}
    relations:
      attachedTo: HvacNode
    tools:
      create: [hvac_add_supply_diffuser]
      update: [hvac_update_supply_diffuser]
      delete: [hvac_remove_supply_diffuser]
    rules: [HVAC-001, HVAC-005]

  ExhaustGrille:
    label: {en: Exhaust grille, ko: 배기 그릴}
    properties:
      airflowCFM: {type: number, unit: CFM, default: 200}
    relations:
      attachedTo: HvacNode
    tools:
      create: [hvac_add_exhaust_grille]
      update: [hvac_update_exhaust_grille]
      delete: [hvac_remove_exhaust_grille]
    rules: [HVAC-001]

  HvacTerminal:
    label: {en: HVAC terminal obstacle, ko: HVAC 단말 장애물}
    parent: Obstacle
    description: "hvac_apply_to_fds 가 만든 0.2 m 정육면체 장애물. 아랫면이 급기(SUPPLY) 또는 배기(EXHAUST). 덱에는 면적으로 나눈 유속(VEL)으로 쓰입니다."
    properties:
      volume_flow_rate: {type: number, unit: "m³/s"}
      face_area: {type: number, unit: "m²", note: "기본 0.04 m²"}
    tools:
      create: [hvac_apply_to_fds]
      update: [transform_obstacle, set_fds_properties]
    rules: [HVAC-003, HVAC-004, HVAC-006]

  # ───────────────────────── sprinkler / water spray ─────────────────────────
  PipeNetwork:
    label: {en: Pipe network, ko: 배관망}
    description: "스프링클러·물분무 수력계산 모듈(Hazen-Williams 관망 해석, NFPA 13 방식 부속 상당길이)."
    relations:
      hasNode: PipeNode
      hasPipe: Pipe
      hasNozzle: Nozzle
      hasSource: WaterSource
      hasZone: DelugeZone
      yields: [PipeResults, DesignScenario]
      appliesAs: SprinklerDevice
      importedFrom: [DrawingCandidate, ExportBundle]
    tools:
      read: [spr_list_summary, spr_get_results]
      run: [spr_run_calc]
      update: [spr_set_defaults, spr_auto_layout, spr_import_network, spr_import_fhc_bundle]
      apply: [spr_apply_to_fds]
      check: [spr_design_review]
      export: [spr_export_results]
    rules: [SPR-001, SPR-002, SPR-003, SPR-004, SPR-016, SPR-017, SPR-020, SPR-050]

  PipeNode:
    label: {en: Pipe node, ko: 배관 노드}
    properties:
      type: {type: enum, values: [junction, sprinkler, source]}
      x: {type: number, unit: m}
      y: {type: number, unit: m}
      z: {type: number, unit: m, default: 3.0}
      floorIndex: {type: integer, note: "층 id(1F = 1). 생략하면 z 가 든 층"}
      fitting: {type: enum, values: [auto, none, elbow90, elbow90_long, elbow45, tee, cross, wye, reducer]}
      label: {type: string, note: "헤드 노드는 겹치지 않게(H1, H2 …) — FDS &DEVC ID 가 됩니다(GEN-021)"}
    relations:
      onStory: Story
    tools:
      create: [spr_add_node, spr_insert_fitting]
      update: [spr_update_node]
      delete: [spr_remove_node]
    rules: [SPR-002, EVAC-001, GEN-021]

  Pipe:
    label: {en: Pipe, ko: 배관}
    properties:
      diameter: {type: number, unit: mm, note: "호칭경"}
      material: {type: string, note: "배관 규격 id(스케줄 포함). 예: KSD3507, JIS_G3454_STPG_SCH40"}
      cFactor: {type: number, note: "Hazen-Williams C. 규격 기본값을 따름"}
      lineNo: {type: string, note: "도면 라인 번호"}
    relations:
      connects: PipeNode
      hasValve: Valve
    tools:
      create: [spr_add_pipe]
      update: [spr_update_pipe, spr_set_pipes]
      delete: [spr_remove_pipe]
    rules: [SPR-005, SPR-006, SPR-021]

  Fitting:
    label: {en: Fitting, ko: 관 부속}
    description: "엘보·티·크로스·와이·레듀서. 상당길이법으로 마찰 손실에 더해집니다."
    tools:
      create: [spr_insert_fitting]
      update: [spr_update_node]
    rules: [SPR-007]

  Valve:
    label: {en: Valve, ko: 밸브}
    properties:
      type: {type: enum, values: [gate_valve, butterfly_valve, check_valve, alarm_valve, globe_valve, angle_valve]}
      open: {type: boolean, note: "false = 닫힘 → 그 관은 계산에서 빠지고 하류가 고립"}
      tag: {type: string}
      zone: {type: string, note: "구역 밸브: 'all' 시나리오와 자기 구역 시나리오에서만 열림"}
    relations:
      mountedOn: Pipe
      controls: DelugeZone
    tools:
      create: [spr_add_pipe, spr_update_pipe]
      update: [spr_set_valves]
    rules: [SPR-008, SPR-022]

  Riser:
    label: {en: Riser, ko: 입상관}
    parent: Pipe
    description: "층간 수직관(같은 x, y). 정수두 ρgΔz 가 계산에 들어갑니다."
    tools:
      create: [spr_add_riser]
    rules: [SPR-009]

  Drain:
    label: {en: Drain hole, ko: 드레인}
    parent: Nozzle
    description: "항상 열린 오리피스. Q = K√P, 요구압 없음."
    tools:
      create: [spr_add_drain]
      update: [spr_set_nozzles]
    rules: [SPR-023]

  Nozzle:
    label: {en: Sprinkler head / nozzle, ko: 헤드·노즐}
    description: "배관망의 방수 지점. closed = 폐쇄형 스프링클러(감열 개방), open = 개방형 노즐(일제살수·물분무), drain = 드레인."
    properties:
      nozzleKind: {type: enum, values: [closed, open, drain]}
      kFactor: {type: number, unit: "L/(min·bar^½)"}
      requiredPressure: {type: number, unit: MPa, note: "이 노즐의 요구 방사압. 비우면 종류별 설계 기본값(기본 0.1 MPa)"}
      zone: {type: string}
      lineNo: {type: string}
      sprayProfileId: {type: string}
    relations:
      attachedTo: PipeNode
      memberOf: DelugeZone
      usesProfile: SprayProfile
      becomes: SprinklerDevice
    tools:
      create: [spr_add_sprinkler_head, spr_import_network, spr_auto_layout]
      update: [spr_update_sprinkler_head, spr_set_nozzles, spr_set_head_spray]
      delete: [spr_remove_sprinkler_head]
    rules: [SPR-010, SPR-011, SPR-024, SPR-025]

  WaterSource:
    label: {en: Water source, ko: 수원}
    properties:
      sourceType: {type: enum, values: [city_water, pump, gravity_tank, pressure_tank]}
      staticPressure: {type: number, unit: MPa}
      residualPressure: {type: number, unit: MPa}
      residualFlow: {type: number, unit: "L/min"}
      pumpRatedFlow: {type: number, unit: "L/min"}
      pumpRatedHead: {type: number, unit: MPa, note: "이름은 head 지만 단위는 MPa"}
      pumpShutoffHead: {type: number, unit: MPa}
      tankElevation: {type: number, unit: m}
    relations:
      attachedTo: PipeNode
      sizedBy: PumpSpec
    tools:
      create: [spr_add_water_source]
      update: [spr_update_water_source, spr_pump_sizing]
      delete: [spr_remove_water_source]
    rules: [SPR-001, SPR-030, SPR-031]

  DelugeZone:
    label: {en: Deluge zone, ko: 일제살수 구역}
    description: "같이 열리는 개방형 노즐 묶음. 설계 계산은 구역마다 한 시나리오를 풉니다."
    relations:
      groups: Nozzle
      controlledBy: Valve
    tools:
      update: [spr_set_nozzles, spr_set_valves, spr_set_defaults]
    rules: [SPR-022, SPR-026]

  SprayProfile:
    label: {en: Spray profile, ko: 분무 프로파일}
    description: "FDS 6.10.1 &PROP + &PART 묶음 템플릿(유량 방식, 분무각, 입경 분포 등). 여러 헤드가 공유합니다."
    properties:
      preset: {type: string, note: "std_pendant_k80, esfr-k200-pendent, mist-high-70bar …"}
    tools:
      create: [spr_upsert_spray_profile]
      update: [spr_upsert_spray_profile, spr_set_head_spray]
      read: [spr_list_summary]
    rules: [SPR-012, SPR-013, SPR-014]

  DesignScenario:
    label: {en: Design scenario, ko: 설계 시나리오}
    description: "'all'(참여 노즐 전부) 또는 'zone:<구역>'. 각 시나리오를 실제 수원 조건(정방향)과 수원압력 역산(설계점)으로 풉니다."
    properties:
      key: {type: string, note: "'all' | 'zone:<zone>'"}
      at: {type: enum, values: [supply, design]}
      requiredSourcePressure: {type: number, unit: MPa}
      governingNozzle: {type: string}
    tools:
      run: [spr_run_calc]
      read: [spr_get_results]
    rules: [SPR-003, SPR-026]

  PumpSpec:
    label: {en: Pump specification, ko: 펌프 사양}
    properties:
      ratedFlow: {type: number, unit: "L/min"}
      ratedPressure: {type: number, unit: MPa}
      churnRatio: {type: number, note: "체절압/정격압 ≤ 1.40"}
      at150Ratio: {type: number, note: "150 % 유량 압력/정격압 ≥ 0.65"}
      motorKw: {type: number, unit: kW}
    tools:
      create: [spr_pump_sizing]
    rules: [SPR-030, SPR-031, SPR-032]

  ReviewFinding:
    label: {en: Design review finding, ko: 설계·사양 검토 결과}
    properties:
      code: {type: string}
      severity: {type: enum, values: [error, warning, info]}
      category: {type: enum, values: [spec, design]}
    tools:
      create: [spr_design_review]
    rules: [SPR-040]

  ExportBundle:
    label: {en: Calculation export bundle, ko: 계산서 내보내기 묶음}
    description: "CSV 표 5종 또는 FHC 계산서 형식 CSV(+ 선택 .FHC/.PDT 초안). <name>_bulc_model.csv 로 그대로 되읽을 수 있습니다."
    tools:
      create: [spr_export_results]
      read: [spr_import_fhc_bundle]
    rules: [SPR-041, SPR-042]

  # ───────────────────────── results ─────────────────────────
  HrrCurve:
    label: {en: HRR curve, ko: 발열량 곡선}
    description: "<CHID>_hrr.csv. 설계 화원과 비교해 화원이 의도대로 탔는지 확인합니다."
    tools:
      read: [fire_results_summary, fire_timeseries]
    rules: [FIRE-001, TRB-003, GEN-010]

  RuntimeMetrics:
    label: {en: Runtime metrics, ko: 실행 지표}
    properties:
      qdot: {type: number, unit: kW}
      tmax: {type: number, unit: K}
      umax: {type: number, unit: "m/s"}
      nan: {type: integer}
    tools:
      read: [sim_status, sim_log_tail, get_simulation_metrics]
    rules: [SIM-007]

  AsetCriteria:
    label: {en: ASET criteria, ko: 인명안전 기준}
    description: "국내 성능위주설계 기준(호흡한계선 1.8 m). 앱 기본값: 온도 60 °C, 가시거리 5 m, CO 1,400 ppm, O₂ 15 %, CO₂ 5 %."
    properties:
      samplingHeight: {type: number, unit: m, default: 1.8}
      tempMax: {type: number, unit: "°C", default: 60}
      visMin: {type: number, unit: m, default: 5}
      coMaxPpm: {type: number, unit: ppm, default: 1400}
      o2Min: {type: number, unit: "%", default: 15}
      co2Max: {type: number, unit: "%", default: 5}
    rules: [ASET-001, ASET-002, ASET-003]

  AsetResult:
    label: {en: ASET result, ko: ASET 결과}
    description: "출구 위치·호흡선 높이에서 기준을 처음 넘는 시각. fire_compute_aset 은 수평 슬라이스(우선) → Plot3D 에서, 앱 결과 뷰어의 ASET/RSET 보고서는 Plot3D → 슬라이스 → CSV 순으로 자료를 찾습니다."
    relations:
      reads: [Plot3D, Slice, DeviceCsv]
      comparedWith: RsetEstimate
    tools:
      read: [fire_compute_aset]
      prepare: [output_add_tenability_slices]
    rules: [ASET-004, OUT-004, OUT-006]

  RsetEstimate:
    label: {en: RSET, ko: 피난 소요 시간}
    description: "감지 + 경보 + 피난 개시 지연 + 이동(피난 계산) + 안전율."
    relations:
      from: EvacSetup
    tools:
      read: [evac_get_results, fire_results_summary]
    rules: [ASET-005]

  PipeResults:
    label: {en: Hydraulic results, ko: 수력계산 결과}
    properties:
      totalFlow: {type: number, unit: "L/min"}
      minMargin: {type: number, unit: MPa}
      maxVelocity: {type: number, unit: "m/s"}
    tools:
      read: [spr_get_results]
    rules: [SPR-003, SPR-004]

  HvacResults:
    label: {en: HVAC results, ko: 풍량 계산 결과}
    tools:
      read: [hvac_get_results]

  # ───────────────────────── drawings ─────────────────────────
  Drawing:
    label: {en: Drawing file, ko: 도면 파일}
    description: "DWG, DXF, PDF, PNG/JPG, zip. 고객 도면은 로컬 경로로만 다루고 외부로 보내지 않습니다."
    properties:
      path: {type: path}
      units: {type: string, note: "DXF $INSUNITS 또는 치수로 확인. 대부분 mm"}
      scale: {type: string, note: "이미지·PDF 는 축척 확인 필수(두 점 사이 실제 거리)"}
    tools:
      check: [bulc_drawing_intake]
    rules: [DRW-001, DRW-002, DRW-003, GEN-012]

  ArchitecturalPlan:
    label: {en: Architectural floor plan, ko: 건축 평면도}
    parent: Drawing
    description: "벽·문·창·계단·실 구획. BULC 0.90 이상은 arch_analyze_drawing(.dxf/.dwg/벡터 .pdf/그림)이 단위·벽 중심선·문·창·기둥·실명·층 표기를 인식하고, arch_import_building 이 한 번의 되돌리기 단계로 벽(&OBST)·문(Door_ HOLE)·창(Win_ HOLE)을 만듭니다(기본 dryRun). 그림은 LLM 이 직접 읽어 arch_import_floorplan_report 로 넣습니다. 구버전 앱은 bulc_drawing_intake 의 벽 후보로 add_wall 등을 씁니다."
    relations:
      yields: [Wall, Door, Window, Slab, Story]
    tools:
      check: [bulc_drawing_intake]
      read: [arch_analyze_drawing]
      apply: [arch_import_building, arch_import_floorplan_report]
      create: [add_wall, add_door, add_window, add_floor, add_hole, draw_add_story]
    rules: [DRW-004, DRW-005, DRW-008]

  SprinklerPlan:
    label: {en: Sprinkler plan, ko: 스프링클러 평면도}
    parent: Drawing
    relations:
      yields: DrawingCandidate
    tools:
      read: [spr_analyze_drawing]
    rules: [DRW-006]

  PipingIsometric:
    label: {en: Piping isometric (ISO), ko: 배관 아이소메트릭}
    parent: Drawing
    description: "선박·플랜트 물분무 배관. 치수(DIMENSION)로 축척, 라인 번호·레듀서·밸브 태그, 노즐 스템, 3D 복원(X, Y 수평, Z 위, 입구 = 원점)."
    relations:
      yields: DrawingCandidate
    tools:
      read: [spr_analyze_drawing]
    rules: [DRW-006, DRW-007, DRW-008]

  DrawingCandidate:
    label: {en: Recognised network candidate, ko: 인식된 배관망 후보}
    properties:
      candidateId: {type: string}
      openEnds: {type: list, note: "드레인 후보"}
      ambiguities: {type: list, note: "사용자에게 물어볼 항목"}
    relations:
      becomes: PipeNetwork
    tools:
      read: [spr_analyze_drawing]
      apply: [spr_import_network]
    rules: [DRW-007, DRW-008, DRW-009]

# 클래스 사이의 핵심 관계를 트리플로도 적어 둡니다(검색·그래프 구성용).
triples:
  - [Project, hasStory, Story]
  - [Story, containsWall, Wall]
  - [Wall, hasOpening, Door]
  - [Door, becomes, Exit]
  - [OpenBoundary, becomes, Exit]
  - [Obstacle, usesSurface, Surface]
  - [Surface, hasLayer, Material]
  - [Fire, requires, Reaction]
  - [Fire, usesRamp, Ramp]
  - [Fire, locatedOn, Slab]
  - [Fire, insideOf, Mesh]
  - [Device, usesProp, Prop]
  - [Control, inputs, Device]
  - [Device, triggers, Control]
  - [Slice, consumedBy, AsetResult]
  - [Plot3D, consumedBy, AsetResult]
  - [Plot3D, consumedBy, FedCoupling]
  - [FedCoupling, feeds, EvacSetup]
  - [EvacSetup, yields, RsetEstimate]
  - [AsetResult, comparedWith, RsetEstimate]
  - [Agent, onStory, Story]
  - [Stair, connects, Story]
  - [Journey, hasStage, Waypoint]
  - [HvacNetwork, appliesAs, HvacTerminal]
  - [SupplyDiffuser, attachedTo, HvacNode]
  - [ExhaustGrille, attachedTo, HvacNode]
  - [Pipe, connects, PipeNode]
  - [Nozzle, attachedTo, PipeNode]
  - [Nozzle, memberOf, DelugeZone]
  - [Valve, mountedOn, Pipe]
  - [WaterSource, attachedTo, PipeNode]
  - [PipeNetwork, appliesAs, SprinklerDevice]
  - [SprinklerDevice, usesProfile, SprayProfile]
  - [PipingIsometric, yields, DrawingCandidate]
  - [SprinklerPlan, yields, DrawingCandidate]
  - [DrawingCandidate, becomes, PipeNetwork]
  - [ArchitecturalPlan, yields, Wall]
  - [PumpSpec, sizes, WaterSource]
