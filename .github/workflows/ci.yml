name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run lint:knowledge
      - run: npm run scan:public
      - run: npm run check:licenses

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm pack contents
        run: npm run check:pack
      - name: MCPB manifest
        # pinned — bump deliberately after checking the manifest schema changes
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json

  knowledge-python:
    name: Knowledge pack (Python validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: JSON-LD is up to date and the pack is consistent
        run: |
          python knowledge/scripts/validate_knowledge.py
