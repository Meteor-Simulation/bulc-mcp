# MCP prompts — task templates that load the matching playbook and its rules.
#
# Each prompt becomes one user message: the task with the user's arguments, the first moves,
# the error- and warning-level rules the playbook cites, and the full playbook text.
# {{name}} is replaced with the argument value, or with "(not given)" when it is empty.

schema_version: 1

prompts:
  - name: bulc-start
    title: {ko: "BULC 작업 시작", en: "Start a BULC session"}
    description: "연결 확인 → 프로젝트 요약 → 핵심 규칙 → 목표 확인. Check the connection, read the project, recall the core rules and ask for the goal."
    arguments:
      - {name: goal, description: "하려는 일 / what you want to do (optional)", required: false}
    playbook: null
    rules: [GEN-018, GEN-005, GEN-001, GEN-003, GEN-006, GEN-011, GEN-015, GEN-016]
    template: |
      BULC 데스크톱 앱으로 작업을 시작합니다. 사용자의 목표: {{goal}}
      Start a BULC session. Answer the user in their language.

      먼저 할 일 / First moves
      1. bulc_connection_status 를 호출해 앱 연결을 확인합니다. 연결되지 않았으면 사용자에게 BULC 앱 실행을 요청하고, 그동안은 지식 도구로 계획만 세웁니다(GEN-018).
      2. 연결되면 project_info(구버전 앱은 get_project_summary)로 현재 프로젝트·층·저장 여부를 읽습니다. 앱 버전에 따라 도구가 다르므로 tools/list 에 있는 도구만 씁니다(GEN-005).
      3. 목표에 맞는 플레이북을 고릅니다(bulc_knowledge_search 또는 아래 목록). 도면 파일이 있으면 bulc_drawing_intake 로 분류합니다.
      4. 도구를 부르기 전에 계획한 순서를 bulc_plan_check 로 점검합니다.
      5. 목표가 비어 있으면 사용자에게 무엇을 할지 묻습니다(화재·연기, 피난, HVAC 제연, 스프링클러·물분무, 덱 점검).
      6. 프로젝트 열기·저장은 project_open / project_save, 실행은 sim_preflight → 사용자 확인 → sim_start 입니다(GEN-014, GEN-016).

      플레이북 / Playbooks: bulc://knowledge/playbooks/01-architectural-drawing-fire-aset, 02-evacuation-fed-rset, 03-hvac-smoke-control, 04-sprinkler-design-fds-activation, 05-marine-water-spray-iso, 06-troubleshooting

  - name: drawing-to-fire-aset
    title: {ko: "건축 도면 → 화재·연기 해석 → ASET", en: "Architectural drawing → fire/smoke model → ASET"}
    description: "평면도(DWG/DXF/PDF/이미지)로 건물 모델을 만들고 화재·연기 해석을 준비해 ASET 을 판정합니다. Build the building from a floor plan, set up the fire run and assess ASET."
    arguments:
      - {name: drawing_path, description: "도면 파일의 이 PC 절대 경로 / absolute local path of the drawing", required: false}
      - {name: building_use, description: "용도(사무소, 판매시설 …) / occupancy type", required: false}
      - {name: fire_scenario, description: "화원 위치·최대 HRR·성장 / fire location, peak HRR, growth (only if the user gave one)", required: false}
    playbook: 01-architectural-drawing-fire-aset
    rules: []
    template: |
      건축 도면으로 BULC 화재·연기 모델을 만들고 ASET 을 판정합니다.
      Build a fire/smoke model from an architectural drawing and assess ASET.

      - 도면 경로 / drawing: {{drawing_path}}
      - 용도 / use: {{building_use}}
      - 화재 시나리오 / fire scenario: {{fire_scenario}}

      먼저 할 일 / First moves
      1. bulc_connection_status → 연결 확인(GEN-018).
      2. 도면 경로가 있으면 bulc_drawing_intake {"path": "<경로>", "purpose": "fire"} 로 분류하고, arch_analyze_drawing {"filePath": "<경로>"} 로 앱이 인식한 벽·문·창과 질문을 받습니다. 단위·축척·원점·층고·최종 출구를 사용자에게 확인합니다(DRW-001, DRW-002, DRW-004).
      3. arch_import_building 은 dryRun(기본)으로 먼저 보여 주고 동의를 받은 뒤 dryRun:false 로 만듭니다(DRW-003).
      4. 화재 시나리오가 비어 있으면 화원을 만들지 말고 사용자에게 묻습니다(GEN-015).
      5. 계획한 도구 순서를 bulc_plan_check 로 점검한 뒤 진행하고, 실행 전에는 sim_preflight → 조건 요약 → 사용자 확인 → sim_start 입니다(GEN-016).
      아래 플레이북의 순서를 따릅니다.

  - name: evacuation-rset
    title: {ko: "피난 + FED 연계 → RSET", en: "Evacuation with FED coupling → RSET"}
    description: "화재 모델 위에 피난자·계단·경로를 넣고 FED 연계로 RSET 을 구해 ASET 과 비교합니다. Add occupants, stairs and routes, couple FED and compare RSET with ASET."
    arguments:
      - {name: occupants, description: "층·실별 재실자 수 / occupant numbers per floor or room", required: false}
      - {name: drawing_path, description: "평면도 경로(선택) / floor-plan path (optional)", required: false}
    playbook: 02-evacuation-fed-rset
    rules: []
    template: |
      피난 모델을 만들고 RSET 을 구합니다. Build the evacuation model and obtain RSET.

      - 재실자 / occupants: {{occupants}}
      - 도면 / drawing: {{drawing_path}}

      먼저 할 일 / First moves
      1. bulc_connection_status → project_info → draw_list_stories 로 층과 zMin 을 읽습니다.
      2. 피난 도구의 floorIndex 는 0부터, 층 도구의 id 는 1부터입니다(EVAC-001).
      3. 재실자 수가 비어 있으면 지어내지 말고 묻습니다(GEN-011).
      4. 피난 실행은 사용자 동의 뒤 evac_run {"confirm": true} → evac_status(끝날 때까지) → evac_get_results 입니다. FED 연계·경보 연동 설정은 앱 EVAC 탭에서 사용자가 켭니다 — 도구로 했다고 말하지 않습니다(EVAC-004).

  - name: hvac-smoke-control
    title: {ko: "HVAC 제연(배출·급기)", en: "HVAC smoke control (exhaust / supply)"}
    description: "덕트망·급배기 단말을 만들고 풍량을 계산해 FDS 에 반영합니다. Build the duct network, calculate airflows and apply them to the FDS model."
    arguments:
      - {name: system, description: "exhaust | supply | pressurization", required: false}
      - {name: airflow, description: "설계 풍량과 단위(CFM, m³/h, m³/s) / design airflow with unit", required: false}
    playbook: 03-hvac-smoke-control
    rules: []
    template: |
      HVAC 제연 계통을 만듭니다. Build the HVAC smoke-control system.

      - 방식 / system: {{system}}
      - 설계 풍량 / design airflow: {{airflow}}

      먼저 할 일 / First moves
      1. HVAC 모듈 풍량 단위는 CFM 입니다. m³/h 는 × 0.5886 으로 바꿉니다(HVAC-001).
      2. 단말 크기를 실제 크기로 정해 과대 유속을 피합니다(HVAC-004). 단말 노드마다 겹치지 않는 label 을 줍니다(GEN-021).
      3. 고친 뒤에는 hvac_run_calc → hvac_apply_to_fds 순서로 다시 반영합니다(HVAC-003).

  - name: sprinkler-design
    title: {ko: "스프링클러 설계 → 수리계산 → FDS 작동 해석", en: "Sprinkler design → hydraulics → FDS activation"}
    description: "스프링클러 평면도 인식·자동 배치·직접 입력으로 배관망을 만들고 수리계산·설계 검토 후 FDS 에 반영합니다. Build the sprinkler network, calculate, review and apply it to FDS."
    arguments:
      - {name: drawing_path, description: "스프링클러 평면도 경로(선택) / sprinkler plan path (optional)", required: false}
      - {name: standard, description: "NFTC103 | NFPA13 | other", required: false}
    playbook: 04-sprinkler-design-fds-activation
    rules: []
    template: |
      스프링클러 배관망을 설계하고 FDS 작동 해석을 준비합니다. Design the sprinkler network and prepare the FDS activation run.

      - 도면 / drawing: {{drawing_path}}
      - 기준 / standard: {{standard}}

      먼저 할 일 / First moves
      1. 도면이 있으면 bulc_drawing_intake {"path": "<경로>", "purpose": "sprinkler"} → spr_analyze_drawing {"filePath": "<경로>"} 순서로 봅니다.
      2. 배관망 압력은 MPa, FDS 헤드 압력은 bar, K 는 L/(min·bar^½) 입니다(SPR-010, SPR-011).
      3. 고친 뒤에는 spr_run_calc 를 다시 돌리고 spr_apply_to_fds 로 반영합니다(SPR-004). 손으로 만드는 헤드 노드에는 겹치지 않는 label 을 줍니다(GEN-021). 법규 값은 원문 확인 필요로 표시합니다(SPR-050).

  - name: marine-water-spray-iso
    title: {ko: "배관 ISO 도면 → 물분무 구역 설계 → 펌프 → 검토", en: "Piping ISO drawing → water-spray zones → pump → review"}
    description: "배관 아이소메트릭 도면에서 물분무 배관망을 인식해 구역별 설계 계산, 수원압력 역산, 펌프 사양, 설계 검토, 계산서 내보내기까지 합니다. Recognise the water-spray network from ISO drawings and carry it through design, pump sizing, review and export."
    arguments:
      - {name: drawing_path, description: "ISO 도면 또는 도면 묶음(zip)의 절대 경로 / absolute path of the ISO drawing or zip bundle", required: false}
      - {name: nozzle_spec, description: "노즐 K 와 요구 방사압(사양서) / nozzle K and required pressure from the datasheet", required: false}
    playbook: 05-marine-water-spray-iso
    rules: []
    template: |
      물분무 배관 ISO 도면으로 구역별 설계를 합니다. Design the water-spray zones from piping ISO drawings.

      - 도면 / drawing: {{drawing_path}}
      - 노즐 사양 / nozzle spec: {{nozzle_spec}}

      먼저 할 일 / First moves
      1. bulc_drawing_intake {"path": "<경로>", "purpose": "water_spray"} 로 분류합니다. 파일은 이 PC 의 앱이 읽고 어디에도 올리지 않습니다(GEN-012).
      2. spr_analyze_drawing → 열린 끝·참조선·모호한 항목을 사용자에게 확인 → spr_import_network 를 dryRun 으로 먼저 부릅니다(DRW-006, DRW-007).
      3. 노즐 요구압·설계 밀도는 사양서·기준에서 받습니다(SPR-025, SPR-053).

  - name: troubleshooting
    title: {ko: "문제 해결", en: "Troubleshooting"}
    description: "증상에서 원인·확인 도구·고치는 법을 찾습니다. Go from a symptom to its cause, the tool that confirms it and the fix."
    arguments:
      - {name: symptom, description: "증상(오류 문구, 이상한 결과) / symptom or error text", required: true}
    playbook: 06-troubleshooting
    rules: []
    template: |
      다음 증상의 원인을 찾고 고칩니다. Diagnose and fix this symptom.

      증상 / symptom: {{symptom}}

      먼저 할 일 / First moves
      1. bulc_connection_status 로 연결과 BULC 식별 결과를 봅니다(GEN-018).
      2. validate_project 를 돌리고 preview_fds 로 관련 namelist 를 봅니다(GEN-006, GEN-007).
      3. bulc_knowledge_search 에 오류 문구를 넣어 관련 규칙을 찾습니다. 확인하지 못한 원인은 추정이라고 밝힙니다.

  - name: review-fds-deck
    title: {ko: "FDS 덱 점검", en: "Review an FDS deck"}
    description: "앱 없이도 .fds 덱을 결정적으로 점검하고 고칠 점을 규칙 id 와 함께 제안합니다. Lint an .fds deck deterministically (no app needed) and propose fixes with rule ids."
    arguments:
      - {name: deck_path, description: ".fds 파일의 절대 경로(앱의 현재 덱이면 비워 둠) / absolute .fds path (leave empty for the app's current deck)", required: false}
    playbook: null
    rules: [GEN-003, MESH-002, MESH-003, OUT-001, VENT-001, FIRE-003, SURF-001, DEVC-004, GEO-006]
    template: |
      FDS 덱을 점검합니다. Review an FDS deck.

      - 덱 / deck: {{deck_path}}

      할 일 / Steps
      1. 경로가 있으면 bulc_check_deck {"path": "<경로>"}, 비어 있으면 bulc_check_deck {"from_app": true} 를 부릅니다.
      2. 결과의 규칙 id 마다 bulc_knowledge_search 로 고치는 법을 확인합니다.
      3. 앱이 연결돼 있으면 고칠 도구(fix.tools)를 제안하고, 사용자가 승인하면 적용한 뒤 validate_project 로 다시 확인합니다.
      4. 전용 도구를 먼저 씁니다. 원문 편집이 꼭 필요하면 preview_fds → 수정 → fds_apply_text(dryRun 먼저)로 반영합니다(GEN-017).
